do da sentença coletiva.", "C": "estava prescrita desde o transcurso de cinco anos após a publicação da sentença coletiva.", "D": "não estava prescrita, e só será assim considerada após o transcurso de dez anos após a publicação da sentença coletiva.", "E": "estava prescrita desde o transcuro de três anos após o trânsito em julgado da sentença coletiva."}, "gabarito": "A", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 42, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>O sistema brasileiro de ações coletivas inspirou-se em modelos internacionais como, por exemplo, nos sistemas italiano e norte-americano, contudo, sem deixar de construir sua própria identidade. No processo civil coletivo, no Brasil,</p>", "opcoes": {"A": "segundo já entendeu o Superior Tribunal de Justiça, uma vez ajuizada a ação coletiva atinente à lide maior geradora de processos multitudinários, extinguem-se automaticamente as ações individuais já propostas ou que venham a ser, até o julgamento final da ação coletiva.", "B": "em tese, quando o Ministério Público ou outro legitimado ativo desistir da ação coletiva sem motivação idônea, o juiz deve imediatamente nomear a Defensoria Pública como sua nova “autora”, com ordem de pronta intervenção.", "C": "o princípio da disponibilidade controlada ou motivada não se aplica quando os direitos ou interesses tutelados forem exclusivamente individuais homogêneos, pois estes são de ordem privada.", "D": "na ação coletiva sobre direitos ou interesses difusos, caso ela seja julgada improcedente, os efeitos da coisa julgada não prejudicarão interesses e direitos individuais dos integrantes da coletividade, tendo ou não os interessados intervindo no processo.", "E": "todo legitimado ativo para a ação civil pública deve demonstrar, preliminarmente, aptidão técnica, idoneidade moral e capacidade econômica para ser habilitado como autor, sob pena de comprometer o interesse público e os direitos de terceiros."}, "gabarito": "D", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 43, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>Em relação às ações constitucionais, em especial, mandado de segurança, ação popular e ação civil pública, marque a alternativa CORRETA.</p>", "opcoes": {"A": "No mandado de segurança, havendo o deferimento de medida liminar contra o Poder Executivo Municipal perante o juiz de primeiro grau, poderá o Município apresentar pedido de suspensão de liminar para evitar grave lesão à ordem, à saúde, à segurança e à economia públicas, junto ao presidente do tribunal ao qual couber o conhecimento do respectivo recurso, e, no caso do deferimento da suspensão da execução da liminar pelo presidente do tribunal, caberá agravo no prazo de 15 (quinze) dias.", "B": "Na ação popular, o prazo de contestação é peremptório de 20 (vinte) dias, improrrogáveis, facultando-se a qualquer cidadão habilitar-se como litisconsorte ou assistente do autor da ação popular.", "C": "As associações constituídas, há pelo menos 1 (um) ano que incluam, entre suas finalidades institucionais, a proteção ao patrimônio público e social, ao meio ambiente, ao consumidor, à ordem econômica, à livre concorrência, aos direitos de grupos raciais, étnicos ou religiosos ou ao patrimônio artístico, estético, histórico, turístico e paisagístico, possuem legitimidade para proporem ação civil pública e, em caso de desistência infundada ou abandono da ação, o Ministério Público ou outro legitimado assumirá a titularidade ativa.", "D": "O mandado de segurança coletivo pode ser impetrado por qualquer partido político na defesa de seus interesses legítimos, relativos a seus integrantes ou à finalidade partidária, ou por organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há, pelo menos, 2 (dois) anos, em defesa de direitos líquidos e certos da totalidade, ou de parte dos seus membros ou associados.", "E": "É cabível ação civil pública para veicular pretensões que envolvam tributos, contribuições previdenciárias, Fundo de Garantia do Tempo de Serviço - FGTS ou outros fundos de natureza institucional, cujos beneficiários podem ser individualmente determinados."}, "gabarito": "C", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 44, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>Assinale a alternativa correta, em relação à ação civil pública, que representa um dos instrumentos processuais da tutela ambiental.</p>", "opcoes": {"A": "Os órgãos públicos legitimados poderão tomar dos interessados compromisso de ajustamento de sua conduta às exigências legais, mediante cominações, que terá eficácia de título executivo judicial.", "B": "Tem legitimidade para propor a ação principal e a ação cautelar a associação que esteja constituída há pelo menos 2 (dois) anos nos termos da lei civil.", "C": "A propositura da ação prevenirá a jurisdição do juízo para todas as ações posteriormente intentadas que possuam a mesma causa de pedir ou o mesmo objeto.", "D": "Em caso de desistência infundada ou abandono da ação por associação legitimada, o Ministério Público tem atribuição exclusiva para assumir a titularidade ativa.", "E": "n.d.a."}, "gabarito": "C", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 45, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>De acordo com entendimento sumulado pelo Supremo Tribunal Federal a respeito do Mandado de Segurança, é correto afirmar que</p>", "opcoes": {"A": "é substitutivo da ação de cobrança e é cabível contra lei em tese.", "B": "não substitui a ação popular, mas é cabível contra decisão judicial com trânsito em julgado.", "C": "não é cabível contra ato judicial passível de recurso ou correição.", "D": "a controvérsia sobre matéria de direito impede sua concessão.", "E": "sua concessão produz efeitos patrimoniais em relação ao período pretérito."}, "gabarito": "C", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 46, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>Assinale a alternativa correta no que diz respeito à legitimidade do Ministério Público para propor Ação Civil Pública.</p>", "opcoes": {"A": "Não tem legitimidade para propor ação em defesa do patrimônio público e indenização decorrente do DPVAT em benefício do segurado.", "B": "Tem legitimidade para propor ação contra cobrança indevida em taxa condominial em prédios de apartamentos e contra ilegalidade de reajuste de mensalidades escolares.", "C": "em legitimidade para propor ação contra cobrança indevida em taxa condominial em prédios de apartamentos e indenização decorrente do DPVAT em benefício do segurado.", "D": "Tem legitimidade para propor ação em defesa do patrimônio público e contra ilegalidade de reajuste de mensalidades escolares.", "E": "Apenas o STF entende que tem legitimidade para ajuizar ação em defesa dos direitos individuais homogêneos dos beneficiários do seguro DPVAT."}, "gabarito": "D", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 47, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>Segundo a Lei de Ação Popular:</p>", "opcoes": {"A": "Para instruir a inicial, o cidadão poderá requerer certidões e informações que julgar necessárias, devendo estas serem fornecidas pelos órgãos e entidades públicas no prazo de dez dias.", "B": "A prova da cidadania, para ingresso em juízo, será feita com o documento de identificação, ou com documento que a ele corresponda.", "C": "Consideram-se também patrimônio público os bens e direitos de valor estético.", "D": "Para a conceituação dos casos de nulidades, o vício de forma fica caracterizado quando o ato não se incluir nas atribuições legais do agente que o praticou.", "E": "n.d.a."}, "gabarito": "C", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 48, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>Uma autoridade pública ordenou a prática de ato ilegal contra determinada pessoa jurídica; com isso, agiu com abuso de poder e violou direito líquido e certo dessa pessoa jurídica. A prejudicada impetrou mandado de segurança contra o ato abusivo, no entanto outra autoridade pública, diversa da que praticou o ato, foi indicada erroneamente como coatora. Vinculada hierarquicamente à autoridade coatora, a autoridade indicada, mesmo não sendo a coatora, manifestou-se no mérito ao prestar informações. Os demais requisitos legais do remédio constitucional foram todos preenchidos.</p>\n<p>Nessa situação hipotética, considerando-se que não houve modificação de competência estabelecida pela Constituição Federal de 1988, o juiz deverá, de acordo com o entendimento jurisprudencial dos tribunais superiores,</p>", "opcoes": {"A": "determinar a emenda à inicial, para que o impetrante indique corretamente a autoridade coatora.", "B": "declarar a nulidade processual, em razão de ilegitimidade passiva da autoridade indicada.", "C": "declarar a invalidade da manifestação da autoridade indicada, chamando ao processo a autoridade coatora legítima.", "D": "aplicar a teoria da encampação, considerando legítima a autoridade indicada como coatora para figurar no polo passivo.", "E": "n.d.a."}, "gabarito": "D", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 49, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>José ajuizou ação de despejo cumulada com cobrança de aluguéis atrasados em desfavor de Paulo, tendo o magistrado julgado procedentes os pedidos, declarando rescindido o contrato de locação, determinando a desocupação do imóvel e condenando Paulo ao pagamento dos valores atrasados. Paulo interpôs recurso de apelação, pedindo a reforma integral da sentença. Durante o trâmite recursal, José iniciou a execução provisória apenas em relação à cobrança dos aluguéis, pois Paulo, após interpor apelação, desocupou voluntariamente o imóvel. Intimado para pagamento da parte líquida da condenação, Paulo agravou da decisão, sustentando ser necessário aguardar o julgamento da apelação antes de se dar andamento à execução provisória.</p>\n<p>Nessa situação hipotética, assinale a opção correta à luz da jurisprudência do STJ.</p>", "opcoes": {"A": "O recurso de agravo de instrumento deverá ser provido, uma vez que, ficando a ação limitada à cobrança dos aluguéis, seria autorizado o recebimento da apelação no efeito suspensivo, visto que a ação passaria a ter natureza exclusivamente condenatória.", "B": "O recurso de agravo de instrumento deverá ser provido, pois a Lei n.º 8.245/1991 não prevê regramento específico em relação aos efeitos do recebimento do recurso de apelação; portanto, o apelo deveria ter sido recebido nos efeitos devolutivo e suspensivo, atendendo à regra geral no CPC.", "C": "O recurso de agravo de instrumento deverá ser denegado, porque a apelação que ataca sentença proferida em ação de despejo, ainda que cumulada com ação de cobrança de débitos atrasados, deve ser recebida somente no efeito devolutivo, em razão de regramento específico da Lei n.º 8.245/1991 em relação aos efeitos do recebimento da apelação.", "D": "O recurso de agravo de instrumento deverá ser denegado, já que, embora não haja regramento específico acerca dos efeitos do recebimento da apelação na Lei n.º 8.245/1991, a desocupação voluntária implicou em desistência do recurso de apelação.", "E": "O recurso de agravo de instrumento não deverá ser conhecido, por ausência de pressuposto objetivo de admissibilidade recursal, pois, além de existir regramento específico acerca dos efeitos do recebimento da apelação na Lei n.º 8.245/1991, a desocupação voluntária implicou desistência do recurso de apelação."}, "gabarito": "C", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 50, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>Quanto à ação revisional de aluguel, assinale a alternativa correta.</p>", "opcoes": {"A": "Na ação o juiz poderá homologar acordo de desocupação, que será executado mediante expedição de mandado de despejo.", "B": "O aluguel fixado na sentença retroage à data do reajuste anteriormente pactuado.", "C": "A sentença não poderá estabelecer periodicidade de reajustamento do aluguel diversa daquela prevista no contrato revisando.", "D": "No curso da ação, o aluguel provisório não será reajustado.", "E": "Em ação proposta pelo locatário, o aluguel provisório não poderá ser inferior ao aluguel vigente."}, "gabarito": "A", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 51, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>Em relação às ações locativas, considere os seguintes enunciados:</p>\n<p>I. Nas ações de despejo, consignação em pagamento de aluguel e acessórios da locação, revisionais de aluguel e renovatórias de locação, os recursos interpostos contra as respectivas sentenças terão efeito meramente devolutivo, possibilitando sua execução provisória.</p>\n<p>II. Nas ações de despejo fundadas na falta de pagamento de aluguel e acessórios da locação, o pedido de rescisão da locação poderá ser cumulado com o pedido de cobrança dos aluguéis e acessórios da locação; nesta hipótese, citar-se-á o locatário para responder ao pedido de rescisão e o locatário e os fiadores para responderem ao pedido de cobrança, devendo ser apresentado, com a inicial, cálculo discriminado do valor do débito.</p>\n<p>III. Na ação revisional de aluguel, de rito sumário, o aluguel fixado na sentença é devido a partir desse arbitramento, bem como as diferenças devidas durante a demanda, exigíveis de imediato à fixação de novo aluguel.</p>\n<p>IV. Na ação renovatória, a petição inicial deverá indicar o exato cumprimento do contrato, desde que o prazo mínimo a renovar e o tempo de exploração do comércio no mesmo ramo, ininterruptamente, pelo locatário, sejam de três anos.</p>\n<p>V. Nas locações ajustadas por escrito e por prazo igual ou superior a trinta meses, a resolução do contrato ocorrerá findo o prazo estipulado, independentemente de notificação ou aviso; findo o contrato ajustado, se o locatário continuar na posse do imóvel alugado por mais de trinta dias sem oposição do locador, presumir-se-á prorrogada a locação por prazo indeterminado, mantidas as demais cláusulas e condições do contrato.</p>\n<p>Está correto o que se afirma APENAS em</p>", "opcoes": {"A": "I, II e V.", "B": "I, III e IV.", "C": "II, III, IV e V.", "D": "I, II e IV.", "E": "III, IV e V."}, "gabarito": "A", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 52, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>Sobre as ações de despejo decorrentes de locação de imóvel residencial urbano, é correto afirmar que</p>", "opcoes": {"A": "se fundadas em falta de pagamento, caberá liminar para desocupação se o contrato trouxer somente a fiança como garantia.", "B": "a execução provisória do despejo por infração legal ou contratual dependerá de caução, real ou fidejussória, não inferior a seis meses nem superior a doze meses do aluguel.", "C": "devem sempre estar instruídas com a prova da propriedade do imóvel ou do compromisso, ainda que seja por denúncia vazia.", "D": "é competente para conhecer e julgar tais ações o foro do lugar da situação do imóvel, salvo se outro houver sido eleito no contrato.", "E": "n.d.a."}, "gabarito": "D", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 53, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>Sobre a purgação de mora em ação de despejo por falta de pagamento, indique a alternativa correta.</p>", "opcoes": {"A": "A correção monetária será aplicada para apuração do valor a ser purgado, desde que prevista contratualmente.", "B": "As multas ou penalidades contratuais não podem ser exigidas do fiador para o fim de purgar a mora.", "C": "As despesas do processo e os honorários advocatí­cios não se incluem no montante a ser purgado.", "D": "O benefício da justiça gratuita não se aplica quando o réu tem condições de purgar a mora.", "E": "Há incompatibilidade entre a contestação e o pedido integral de emenda da mora."}, "gabarito": "E", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 54, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>Pedro alugou um imóvel pertencente a Maria. Os fiadores, João e Mateus, não renunciaram ao benefício de ordem nem optaram expressamente pelo benefício da divisão. Diante da ausência de pagamento de Pedro, Maria ajuizou ação de despejo cumulada com cobrança de alugueres vencidos e vincendos. Julgado procedente o pedido, na fase de execução do julgado, ante a ausência de bens de Pedro e João, foi penhorado imóvel de Mateus, o qual argumentou que o bem era destinado à sua residência com os filhos menores.</p>\n<p>Considerando essa situação hipotética à luz da legislação aplicável ao caso e da jurisprudência do STJ, assinale a opção correta</p>", "opcoes": {"A": "É reconhecido benefício de ordem em favor de João, ainda que Pedro seja insolvente.", "B": "Um dos pressupostos para o conhecimento de ações semelhantes à impetrada por Maria é a demonstração de atraso de, no mínimo, três meses no pagamento do aluguel.", "C": "Mateus poderia alegar o benefício da divisão e exigir de João a parte que lhe cabe no pagamento.", "D": "A penhora realizada sobre o bem de família de Mateus foi legítima.", "E": "n.d.a."}, "gabarito": "D", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 55, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>Elder e César firmaram contrato de locação de imóvel residencial urbano, na qualidade, respectivamente, de locador e locatário. Em seguida, o imóvel foi legitimamente sublocado por César para Roberto. Meses depois, em razão de suposta prática de um ilícito contratual, Elder ajuizou ação de despejo contra César.</p>\n<p>Nessa situação hipotética, o ingresso voluntário de Roberto no processo para defesa de seus interesses</p>", "opcoes": {"A": "dependerá de autorização prévia das partes principais e ocorrerá por meio de chamamento ao processo.", "B": "deverá ser feito na qualidade de assistente litisconsorcial do locatário.", "C": "somente poderá ser realizado até o momento do saneamento do processo.", "D": "é expressamente vedado segundo regra prevista na lei que regulamenta a locação de imóveis urbanos.", "E": "não obsta que a parte principal reconheça a procedência do pedido da ação de despejo."}, "gabarito": "B", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 56, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>Julgue os seguintes itens, acerca de ação civil pública, ação popular, habeas corpus e mandado de injunção.</p>\n<p>I O STJ firmou entendimento de que, em ação civil pública promovida pelo Ministério Público, o adiantamento dos honorários periciais ficará a cargo da Fazenda Pública a qual está vinculado o parquet.</p>\n<p>II O Ministério Público poderá interpor recurso contra sentença proferida que julgou improcedente o pedido do autor da ação popular.</p>\n<p>III O STJ fixou entendimento de que a ausência de parecer escrito do parquet em sede de habeas corpus gera automática nulidade do julgamento.</p>\n<p>IV O mandado de injunção pode ser individual ou coletivo, podendo, nesse último caso, ser promovido pelo Ministério Público.</p>\n<p>Estão certos apenas os itens</p>", "opcoes": {"A": "I e II.", "B": "I e III.", "C": "III e IV.", "D": "I, II e IV.", "E": "II, III e IV."}, "gabarito": "D", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 57, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>No que concerne ao processo de execução, à ação civil pública e ao mandado de segurança, julgue os itens a seguir.</p>\n<p>I O exequente que possui título executivo extrajudicial contendo obrigação alimentar pode optar pelo procedimento padrão para execução de quantia certa e, nesse caso, se houver penhora sobre dinheiro, eventual concessão de efeito suspensivo aos embargos à execução não impede o levantamento mensal das prestações alimentares devidas.</p>\n<p>II Segundo a atual jurisprudência do STJ, o Ministério Público possui legitimidade ativa para, em sede de tutela coletiva, defender direitos de consumidores que celebram contratos de compra e venda de imóveis com cláusulas pretensamente abusivas.</p>\n<p>III De acordo com o STJ, caso ocorra o óbito do impetrante durante a fase de conhecimento de mandado de segurança, o magistrado deverá determinar a suspensão do processo para posterior sucessão do espólio ou dos herdeiros do falecido.</p>\n<p>Assinale a opção correta.</p>", "opcoes": {"A": "Apenas o item I está certo.", "B": "Apenas o item III está certo", "C": "Apenas os itens I e II estão certos.", "D": "Apenas os itens II e III estão certos.", "E": "Todos os itens estão certos."}, "gabarito": "C", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 58, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>O Ministério Público ajuizou ação civil pública em face de ex-prefeito de município por ato de improbidade administrativa, causador de lesão ao erário e atentatório aos princípios da Administração Pública, praticado no exercício do mandato eletivo. A partir desses fatos, assinale a alternativa correta, considerando a jurisprudência majoritária dos Tribunais Superiores.</p>", "opcoes": {"A": "Em ação civil pública não há adiantamento de custas, emolumentos, honorários periciais e quaisquer outras despesas, nem condenação das partes do processo em honorários de advogado.", "B": "Se o Ministério Público requerer realização de perícia e houver determinação de adiantamento de honorários periciais, estes sempre devem ser arcados pelo fundo dos direitos difusos.", "C": "Se a ação for julgada improcedente, não é possível a condenação do Ministério Público no pagamento de honorários advocatícios.", "D": "Se a ação for julgada procedente, tratando-se de ação civil pública, não cabe condenação dos réus no pagamento de honorários advocatícios, nem pagamento das custas da perícia, se a mesma já foi suportada pelo Estado em adiantamento.", "E": "Se a ação for julgada procedente, como ela foi proposta pelo Ministério Público, não cabe condenação em honorários advocatícios, por ser verba destinada a advogado."}, "gabarito": "E", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 59, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>Com relação a Ação Civil Pública, considere:</p>\n<p>I. A empresa pública possui legitimidade para propor a ação principal.</p>\n<p>II. A sociedade de economia mista possui legitimidade para propor a ação principal.</p>\n<p>III. Não se admite litisconsórcio facultativo entre os Ministérios Públicos da União, do Distrito Federal e dos Estados na defesa dos interesses e direitos pleiteados na referida Ação.</p>\n<p>IV. É facultado ao Poder Público e a outras associações legitimadas habilitar-se como litisconsortes de qualquer das partes.</p>\n<p>Está correto o que se afirma APENAS em</p>", "opcoes": {"A": "I e III.", "B": "I, II e IV.", "C": "II, III e IV.", "D": "I e II.", "E": "III e IV."}, "gabarito": "B", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}, {"num": 60, "tema": "Módulo 9 - Ações Locatícias", "enunciado": "<p>Quanto ao Processo Civil Coletivo, é correta a seguinte afirmação:</p>", "opcoes": {"A": "Ainda que mais de um legitimado proponha ação coletiva em defesa do mesmo interesse coletivo, não se configura a litispendência, por não existir a identidade de parte ativa.", "B": "A Defensoria Pública tem legitimidade para propor ação civil pública na defesa de direitos difusos, coletivos e individuais homogêneos.", "C": "Uma pessoa que não tenha participado de ação civil pública como litisconsorte não pode beneficiar-se do resultado favorável e promover a execução individual.", "D": "A sentença proferida fará coisa julgada erga omnes, ainda quando julgada improcedente por falta de provas.", "E": "As ações coletivas que versem sobre direitos difusos e direitos coletivos em sentido estrito induzem litispendência para as ações individuais."}, "gabarito": "B", "core": true, "sintese": "<p>Os litígios oriundos de imóveis regem-se pela <strong>Lei do Inquilinato (Lei 8.245/91)</strong>. Abordam despejos, renovação contratual compulsória e consignação de aluguéis.</p>", "fundamentacao": "<p>Foco nos <strong>arts. 58 e seguintes da Lei 8.245/91</strong>.</p>\n\n<p>Em regra, os recursos nessas ações possuem efeito <strong>somente devolutivo</strong>.</p>", "dica": "<p><strong>Fique de Olho!</strong> Na sublocação, o sublocatário legítimo que entra na ação de despejo figura como <strong>Assistente Litisconsorcial</strong> (e não simples) do locatário. Isso cai muito em provas!</p>"}];
const RESUMOS = [{"title": "Interdição e Curatela", "body": "\n<p>A Curatela sofreu uma verdadeira revolução com a entrada do <strong>Estatuto da Pessoa com Deficiência (Lei Brasileira de Inclusão - Lei 13.146/15)</strong>. O paradigma da incapacidade civil foi profundamente alterado.</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>A Deficiência não gera Incapacidade:</strong> A regra geral agora é que a deficiência física ou intelectual não afeta a plena capacidade civil da pessoa para atos existenciais.</li>\n<li>  <strong>Caráter Extraordinário:</strong> A curatela passou a ser uma medida de caráter extraordinário, proporcional às necessidades e às circunstâncias do caso, durando o menor tempo possível.</li>\n<li>  <strong>Atos Patrimoniais:</strong> A restrição imposta pela curatela afeta <strong>somente</strong> os atos de natureza patrimonial ou negocial. O curatelado mantém seu direito ao próprio corpo, sexualidade, matrimônio, privacidade, educação e voto.</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Arts. 84 e 85 do EPD:</strong> \"A curatela afetará tão somente os atos relacionados aos direitos de natureza patrimonial e negocial.\"</li>\n<li>  <strong>Art. 747 do CPC:</strong> Podem promover a interdição o cônjuge ou companheiro, os parentes ou tutores, o representante da entidade onde se encontra o interditando ou o Ministério Público.</li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote>Quando o Ministério Público pode promover a interdição? Apenas em caráter subsidiário! O MP age no caso de <strong>doença mental grave</strong>, ou quando as pessoas legitimadas (parentes/cônjuge) não existirem, forem menores, ou houver <strong>conflito de interesses</strong> entre elas e o interditando.</blockquote>\n\n<p>---</p>"}, {"title": "Juizados Especiais Cíveis (JEC)", "body": "\n<p>Os Juizados Especiais Cíveis Estaduais são regidos pela famosíssima <strong>Lei 9.099/95</strong>, desenhados para democratizar o acesso à justiça de causas de menor complexidade.</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>Princípios Norteadores:</strong> Oralidade, simplicidade, informalidade, economia processual e celeridade, buscando <strong>sempre</strong> a conciliação ou a transação.</li>\n<li>  <strong>Competência Híbrida:</strong> </li>\n</ul>\n<p>    *   Causas de até <strong>20 Salários Mínimos</strong>: A presença de advogado é <strong>facultativa</strong>.</p>\n<p>    *   Causas de 20 a <strong>40 Salários Mínimos</strong>: A presença de advogado é <strong>obrigatória</strong>.</p>\n<ul>\n<li>  <strong>Critérios Territoriais:</strong> Regra geral, domicílio do réu ou local onde a obrigação deve ser satisfeita. Nas ações de reparação de danos, pode ser ajuizada no domicílio do <strong>autor</strong> ou no local do fato.</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Lei 9.099/95 (Art. 3º e 4º):</strong> Estipula os limites de valor (40 SM) e a inaplicabilidade de perícia complexa.</li>\n<li>  <strong>Art. 41 e 42:</strong> O recurso cabível contra sentença é o Recurso Inominado, com prazo de <strong>10 dias</strong>.</li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote><strong>Contagem de Prazo e Preparo:</strong> No JEC, o prazo para interpor recurso não é de 15 dias (como no CPC comum), mas de <strong>10 dias úteis</strong>! Além disso, o preparo deve ser recolhido independentemente de intimação, nas 48 horas seguintes à interposição, sob pena de <strong>deserção</strong> (não há intimação para complementar).</blockquote>\n\n<p>---</p>"}, {"title": "JEF e Fazenda Pública", "body": "\n<p>Os Juizados da Fazenda e Federais diferem do JEC estadual principalmente por sua <strong>competência absoluta</strong> e pelo teto estendido de alçada, além de lidar diretamente com Entes Públicos.</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>JEF (Juizado Especial Federal):</strong> Causas contra a União, autarquias (INSS) e fundações federais de até <strong>60 Salários Mínimos</strong>.</li>\n<li>  <strong>JEFP (Juizado Especial da Fazenda Pública):</strong> Causas contra Estados, DF, Territórios e Municípios também de até <strong>60 Salários Mínimos</strong>. Onde estiver instalado, sua competência é <strong>absoluta</strong> (você não pode escolher ir para a Vara Comum da Fazenda, a menos que abra mão do valor excedente).</li>\n<li>  <strong>Recursos Ordinários:</strong> Não existe reexame necessário (remessa necessária de ofício) nas decisões desfavoráveis à Fazenda Pública dentro dos Juizados Especiais.</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Lei 10.259/01 (JEF) e Lei 12.153/09 (JEFP).</strong></li>\n<li>  <strong>Art. 13 da Lei 10.259/01:</strong> Dispensado o reexame necessário.</li>\n<li>  <strong>Art. 17 da Lei 10.259/01:</strong> Pagamento via Requisição de Pequeno Valor (RPV), prazo de 60 dias para o Ente quitar o débito judicial.</li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote>Não confunda a execução nos Juizados! O Ente Público que perde no JEF/JEFP não paga via demorado sistema de <strong>Precatórios</strong>. O montante deve ser pago diretamente por meio de ordem do juiz através da <strong>Requisição de Pequeno Valor (RPV)</strong>.</blockquote>\n\n<p>---</p>"}, {"title": "ACP e Mandado de Segurança", "body": "\n<p>O Módulo 8 explora os pilares do Direito Constitucional e Processo Coletivo: ferramentas extremas de defesa da coletividade ou de direitos incontestáveis.</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>Ação Civil Pública:</strong> Visa a responsabilização por danos materiais e morais causados ao meio ambiente, consumidor, ordem urbanística ou interesses difusos/coletivos/individuais homogêneos.</li>\n<li>  <strong>Mandado de Segurança:</strong> Ação constitucional de rito sumaríssimo para proteger direito <strong>líquido e certo</strong> contra ilegalidade ou abuso de poder praticado por Autoridade Pública ou agente no exercício de atribuições do Poder Público.</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Lei 7.347/85 (ACP, art. 18):</strong> \"Nas ações de que trata esta lei, não haverá adiantamento de custas, emolumentos, honorários periciais e quaisquer outras despesas, nem condenação da associação autora, salvo comprovada má-fé, em honorários de advogado\".</li>\n<li>  <strong>Lei 12.016/09 (MS):</strong> Exige prova pré-constituída (não há dilação probatória, ou seja, não se escuta testemunhas ou faz-se perícia durante o MS). Prazo decadencial de <strong>120 dias</strong>.</li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote><strong>Princípio da Simetria:</strong> De acordo com o STJ, como o Ministério Público não pode ser condenado em honorários sucumbenciais se perder a ACP (salvo má-fé), por uma questão de isonomia (simetria), se ele ganhar, os requeridos também <strong>não</strong> pagarão honorários ao MP. Fique atento também às Súmulas do STF/STJ para o MS: <strong>Não cabe MS</strong> contra decisão transitada em julgado (Súmula 268/STF).</blockquote>\n\n<p>---</p>"}, {"title": "Ações Locatícias e Processos Coletivos", "body": "\n<p>As ações baseadas na <strong>Lei do Inquilinato (Lei 8.245/91)</strong> trazem ritos diferenciados que despencam em concursos devido à especificidade de seus recursos e defesas.</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>Ação de Despejo:</strong> Pode ser cumulada com a ação de cobrança de aluguéis. Para se conseguir uma <strong>Liminar de Desocupação em 15 dias</strong> (no caso de falta de pagamento), o contrato precisa estar desprovido de qualquer uma das garantias previstas no art. 37 (Fiança, Caução, Seguro-fiança).</li>\n<li>  <strong>Ação Renovatória:</strong> Ferramenta do locatário <strong>comercial/empresarial</strong> para garantir a continuidade de seu negócio. Precisa ter contrato escrito com prazo de 5 anos; exploração do mesmo ramo há 3 anos ininterruptos.</li>\n<li>  <strong>Recursos na Lei de Locações:</strong> Em regra, as apelações interpostas nas ações locatícias (despejo, consignatória, revisional e renovatória) possuem <strong>apenas efeito devolutivo</strong>, ou seja, a sentença pode ser executada provisoriamente de imediato.</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Lei 8.245/91, Art. 58, V:</strong> Os recursos interpostos contra as sentenças terão efeito somente devolutivo.</li>\n<li>  <strong>Art. 59, § 2º (Assistência):</strong> Em qualquer fundamento na ação de despejo, será dada ciência aos sublocatários, que poderão intervir no processo. O STJ definiu essa atuação como a de <strong>assistente litisconsorcial</strong>.</li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote><strong>Atenção ao Sublocatário!</strong> Como a sentença de despejo afetará fatalmente a esfera jurídica e o direito de posse do sublocatário legítimo, ao ingressar no feito ele não é mero assistente simples, mas sim <strong>Assistente Litisconsorcial</strong> do Locatário-Réu, figurando como um escudo jurídico ativo contra eventuais acordos obscuros.</blockquote>"}];
let questions = [...ALL_QUESTIONS];
let currentIdx = 0;
let score = 0;
let answered = {};
let timerInterval = null;
let timerValue = 45;

function openModal() {
  const m = document.getElementById('resumo-modal');
  const b = document.getElementById('modal-body');
  if (b.children.length === 0) {
      RESUMOS.forEach((r, idx) => {
        const btn = document.createElement('button');
        btn.className = 'resumo-btn';
        btn.innerHTML = `📖 ${r.title}`;
        
        const txt = document.createElement('div');
        txt.className = 'resumo-text';
        txt.id = `resumo-txt-${idx}`;
        txt.innerHTML = r.body;
        
        btn.onclick = () => {
          const isActive = txt.classList.contains('active');
          document.querySelectorAll('.resumo-text').forEach(el => el.classList.remove('active'));
          if (!isActive) txt.classList.add('active');
        };
        
        b.appendChild(btn);
        b.appendChild(txt);
      });
  }
  m.style.display = 'flex';
}

function closeModal(e) {
  if(e) e.preventDefault();
  document.getElementById('resumo-modal').style.display = 'none';
}

function buildCarousel() {
  const c = document.getElementById('carousel');
  c.innerHTML = '';

  const intro = document.createElement('div');
  intro.className = 'slide';
  intro.innerHTML = `
    <div class="intro-card">
      <h1>Simulado · Jurisdição Voluntária</h1>
      <p>Material otimizado para celulares! Arraste ou clique em "Avançar" para começar. Clique em "Resumos" no menu superior para ler as sínteses separadas. <strong>Contém ${questions.length} questões alinhadas com os conteúdos das aulas.</strong></p>
    </div>`;
  c.appendChild(intro);

  questions.forEach((q, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = buildQuestionSlide(q, i);
    c.appendChild(slide);
  });

  const result = document.createElement('div');
  result.className = 'slide';
  result.id = 'result-slide';
  result.innerHTML = `
    <div class="result-card">
      <div class="result-score" id="final-score">0</div>
      <div class="result-label">acertos de <strong>${questions.length}</strong> questões</div>
      <div class="result-pct" id="final-pct">0%</div>
      <button class="btn-restart" onclick="location.reload()">🔄 Reiniciar Simulado</button>
    </div>`;
  c.appendChild(result);
  updateCounter();
}

function buildQuestionSlide(q, i) {
  const optsHtml = Object.entries(q.opcoes).map(([k,v]) => `
    <div class="opt" id="opt-${i}-${k}" onclick="selectOpt(${i}, '${k}')">
      <span class="opt-letter">${k}</span>
      <span>${v}</span>
    </div>`).join('');

  return `
    <div class="q-card" id="qcard-${i}">
      <div class="q-inner" id="qinner-${i}">
        <div class="q-face q-front">
          <div class="q-meta">
            <span class="q-num">Q${i+1} / ${questions.length}</span>
            <span class="q-tema">${q.tema}</span>
          </div>
          <div class="timer-bar-wrap"><div class="timer-bar" id="tbar-${i}"></div></div>
          <div class="timer-count" id="tcount-${i}">45s</div>
          <div class="q-enunc">${q.enunciado}</div>
          <div class="options">${optsHtml}</div>
          <div class="flip-hint">Toque na resposta correta para virar o card</div>
        </div>
        <div class="q-face q-back" onclick="unflip(${i})">
          <span class="gab-badge">✅ Gabarito: ${q.gabarito})</span>
          <div class="back-section">
            <div class="back-section-title">📚 Síntese Teórica</div>
            ${q.sintese}
          </div>
          <div class="back-section legal">
            <div class="back-section-title">⚖️ Fundamentação Jurídica</div>
            ${q.fundamentacao}
          </div>
          <div class="back-section dica">
            <div class="back-section-title">🚨 Dica de Prova</div>
            ${q.dica}
          </div>
          <div class="flip-hint">Toque para voltar para a pergunta</div>
        </div>
      </div>
    </div>`;
}

function selectOpt(i, letter) {
  if (answered[i] !== undefined) return;
  answered[i] = letter;
  const q = questions[i];
  const isCorrect = letter === q.gabarito;
  if (isCorrect) score++;
  document.getElementById('score').textContent = `Acertos: ${score}`;

  ['A','B','C','D','E'].forEach(k => {
    const el = document.getElementById(`opt-${i}-${k}`);
    if (!el) return;
    if (k === q.gabarito) el.classList.add('correct');
    else if (k === letter && !isCorrect) el.classList.add('wrong');
  });

  stopTimer();
  setTimeout(() => flipCard(i), 850);
}

function flipCard(i) {
  document.getElementById(`qinner-${i}`).classList.add('flipped');
}
function unflip(i) {
  document.getElementById(`qinner-${i}`).classList.remove('flipped');
}

let currentTimerIdx = -1;
function startTimer(i) {
  stopTimer();
  timerValue = 45;
  currentTimerIdx = i;
  const bar = document.getElementById(`tbar-${i}`);
  const cnt = document.getElementById(`tcount-${i}`);
  if (!bar || !cnt) return;
  bar.style.width = '100%';
  bar.style.background = 'var(--accent)';
  timerInterval = setInterval(() => {
    timerValue--;
    const pct = (timerValue / 45) * 100;
    bar.style.width = pct + '%';
    cnt.textContent = timerValue + 's';
    if (timerValue <= 10) { bar.style.background = '#ef4444'; cnt.style.color = '#ef4444'; }
    if (timerValue <= 0) {
      stopTimer();
      if (answered[i] === undefined) flipCard(i);
    }
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function goTo(idx) {
  const total = questions.length + 2;
  currentIdx = Math.max(0, Math.min(idx, total - 1));
  const c = document.getElementById('carousel');
  c.style.transform = `translateX(-${currentIdx * 100}%)`;
  stopTimer();
  if (currentIdx > 0 && currentIdx <= questions.length) {
    const qIdx = currentIdx - 1;
    if (answered[qIdx] === undefined) startTimer(qIdx);
  }
  if (currentIdx === questions.length + 1) {
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-pct').textContent = Math.round((score / questions.length) * 100) + '%';
  }
  updateCounter();
}

function navigate(dir) { goTo(currentIdx + dir); }

function updateCounter() {
  const total = questions.length;
  let label;
  if (currentIdx === 0) label = `Início`;
  else if (currentIdx > total) label = `Fim`;
  else label = `${currentIdx} / ${total}`;
  document.getElementById('counter').textContent = label;
}

buildCarousel();
goTo(0);
</script>
</body>
</html>

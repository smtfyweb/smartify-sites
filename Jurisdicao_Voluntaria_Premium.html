<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurisdição Voluntária · NP2</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --primary: #7c1a1a;
  --accent: #c0392b;
  --accent-soft: rgba(192,57,43,0.08);
  --text: #334155;
  --text-dim: #64748b;
  --border: #e2e8f0;
  --shadow: 0 10px 25px -5px rgba(0,0,0,0.06);
  --blue: #1d4ed8;
  --blue-bg: #eff6ff;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --rose: #be123c;
  --rose-bg: #fff1f2;
  --green: #059669;
  --green-bg: rgba(5,150,105,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; font-family:'Inter', sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

/* Formatação do conteúdo em HTML gerado pelo Markdown */
p { margin-bottom: 12px; line-height: 1.6; font-size: 14px; }
p:last-child { margin-bottom: 0; }
h2 { font-size: 18px; color: var(--primary); margin: 24px 0 12px 0; }
h3 { font-size: 15px; color: var(--blue); margin: 20px 0 10px 0; display:flex; align-items:center; gap:6px; }
ul { padding-left: 20px; margin-bottom: 16px; }
li { margin-bottom: 8px; line-height: 1.5; font-size: 14px; }
strong { font-weight: 700; color: #1e293b; }
blockquote { background: var(--amber-bg); border-left: 4px solid var(--amber); padding: 12px 16px; margin: 16px 0; border-radius: 0 8px 8px 0; font-style: italic; color: #78350f; }
hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }

.bg { position:fixed; inset:0; z-index:0;
  background: radial-gradient(at 0% 0%, rgba(192,57,43,0.04) 0, transparent 50%),
              radial-gradient(at 100% 100%, rgba(124,26,26,0.04) 0, transparent 50%); }

/* HEADER */
.hd { position:fixed; top:0; left:0; right:0; z-index:200; height:64px;
  background:rgba(255,255,255,0.88); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; backdrop-filter:blur(12px); }
.hd-left { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.hd-logo { background:var(--primary); color:#fff; font-weight:700; font-size:12px;
  padding:4px 8px; border-radius:6px; letter-spacing:.5px; }
.hd-title { font-size:13px; font-weight:700; color:var(--primary); text-transform:uppercase; }
.hd-right { display:flex; align-items:center; gap:8px; }

.btn-resumo { padding:6px 14px; border-radius:4px; border:none;
  font-size:12px; font-weight:700; cursor:pointer; background:var(--primary);
  color:#fff; transition:all .2s; }
.btn-resumo:hover { background:#6b1111; }

.counter-pill { font-size:12px; font-weight:700; color:var(--primary);
  background:var(--accent-soft); padding:4px 12px; border-radius:20px; }

/* MAIN */
.main { position:fixed; inset:0; top:64px; bottom:72px; overflow:hidden; z-index:1; }

/* CAROUSEL */
.carousel { display:flex; height:100%; transition:transform .45s cubic-bezier(.4,0,.2,1); }
.slide { min-width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:15px; }

/* INTRO SLIDE */
.intro-card { background:var(--card); border-radius:24px; padding:30px;
  box-shadow:var(--shadow); max-width:700px; width:100%; max-height:85vh; overflow-y:auto; }
.intro-card h1 { font-family:'Cormorant Garamond',serif; font-size:clamp(22px,4vw,34px);
  color:var(--primary); margin-bottom:8px; }
.intro-card p { color:var(--text-dim); font-size:14px; margin-bottom:24px; }

/* QUESTION CARD */
.q-card { perspective:1200px; max-width:680px; width:100%; height:min(620px, calc(100vh - 150px)); cursor:pointer; }
.q-inner { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.4,0,.2,1); }
.q-inner.flipped { transform:rotateY(180deg); }
.q-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:24px;
  box-shadow:var(--shadow); overflow-y:auto; overflow-x:hidden; background:var(--card); }

.q-front { padding:24px; display:flex; flex-direction:column; gap:12px; }
.q-back { padding:24px; transform:rotateY(180deg); display:flex; flex-direction:column; gap:16px; }

/* Front elements */
.q-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex-shrink:0; }
.q-num { font-size:12px; font-weight:600; color:var(--primary); background:var(--accent-soft);
  padding:3px 10px; border-radius:10px; }
.q-tema { font-size:11px; color:var(--text-dim); font-weight:500; }
.timer-bar-wrap { height:4px; background:#f1f5f9; border-radius:2px; overflow:hidden; flex-shrink:0; margin-top:4px; }
.timer-bar { height:100%; background:var(--accent); border-radius:2px; transition:width 1s linear, background .3s; }
.timer-count { font-size:11px; font-weight:700; color:var(--text-dim); text-align:right; flex-shrink:0; margin-bottom:4px; }
.q-enunc { margin-bottom:12px; } /* Deixando as formatações baseadas na tag p */
.q-enunc p { color:var(--primary); font-size:clamp(13.5px,2.5vw,15px); font-weight:500; }

.options { display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:12px;
  border:1.5px solid var(--border); cursor:pointer; transition:all .2s; font-size:13px; line-height:1.4; }
.opt:hover { border-color:var(--accent); background:var(--accent-soft); }
.opt.selected { border-color:var(--accent); background:var(--accent-soft); }
.opt.correct { border-color:var(--green); background:var(--green-bg); color:#065f46; font-weight:600; }
.opt.wrong { border-color:var(--rose); background:var(--rose-bg); }
.opt-letter { font-weight:800; color:var(--accent); min-width:18px; font-size:14px; margin-top:1px; }

/* Back elements */
.gab-badge { display:inline-flex; align-items:center; gap:8px; background:#d1fae5;
  color:#065f46; font-weight:700; font-size:14px; padding:10px 18px; border-radius:12px; flex-shrink:0; }
.back-section { background:var(--blue-bg); border-left:4px solid var(--blue);
  padding:16px 20px; border-radius:0 8px 8px 0; }
.back-section.legal { background:var(--amber-bg); border-color:var(--amber); }
.back-section.dica { background:var(--rose-bg); border-color:var(--rose); }
.back-section-title { font-size:11px; font-weight:800; text-transform:uppercase;
  letter-spacing:.5px; color:var(--blue); margin-bottom:8px; }
.back-section.legal .back-section-title { color:var(--amber); }
.back-section.dica .back-section-title { color:var(--rose); }

.flip-hint { font-size:11px; color:var(--text-dim); text-align:center; margin-top:auto; padding-top:10px; }

/* FOOTER NAV */
.ft { position:fixed; bottom:0; left:0; right:0; z-index:200; height:72px;
  background:rgba(255,255,255,0.95); border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; backdrop-filter:blur(12px); gap:12px; }
.nav-btn { padding:12px 24px; border-radius:4px; border:none; font-size:14px;
  font-weight:700; cursor:pointer; transition:all .2s; flex:1; max-width:160px; }
.btn-prev { background:var(--primary); color:#fff; opacity:0.9; }
.btn-prev:hover { background:#6b1111; opacity:1; }
.btn-next { background:var(--primary); color:#fff; }
.btn-next:hover { background:#6b1111; }
.score-pill { font-size:13px; font-weight:800; color:var(--primary);
  background:var(--accent-soft); padding:8px 16px; border-radius:20px; white-space:nowrap; text-align:center; }

/* RESULT SLIDE */
.result-card { background:var(--card); border-radius:24px; padding:48px 36px;
  text-align:center; max-width:500px; width:100%; box-shadow:var(--shadow); }
.result-score { font-size:64px; font-weight:800; color:var(--primary); line-height:1; }
.result-label { font-size:16px; color:var(--text-dim); margin-top:8px; margin-bottom:24px; }
.result-pct { font-size:22px; font-weight:700; color:var(--accent); margin-bottom:32px; }
.btn-restart { padding:14px 36px; background:var(--primary); color:#fff; border:none;
  border-radius:4px; font-size:15px; font-weight:700; cursor:pointer; transition:.2s; }

/* MODAL RESUMO */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; display:none; justify-content:center; align-items:center; backdrop-filter:blur(4px); }
.modal-content { background:#fff; width:95%; max-width:700px; max-height:85vh; border-radius:20px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); }
.modal-header { padding:18px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--blue-bg); }
.modal-header h2 { font-size:18px; color:var(--blue); margin:0; }
.btn-close { background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-dim); }
.modal-body { padding:0; overflow-y:auto; flex:1; display:flex; flex-direction:column; }
.resumo-btn { padding:18px 24px; text-align:left; border:none; border-bottom:1px solid var(--border); background:#fff; font-size:15px; font-weight:700; color:var(--primary); cursor:pointer; transition:.2s; }
.resumo-btn:hover { background:var(--bg); }
.resumo-text { padding:24px; display:none; background:#fff; border-bottom:1px solid var(--border); }
.resumo-text.active { display:block; }

/* Ajustes Mobile Finos (iPhone) */
@media (max-width: 600px) {
  .hd { padding:0 12px; } 
  .ft { padding:0 12px; }
  .q-front, .q-back { padding:20px 16px; }
  .intro-card { padding:24px 18px; }
  
  .hd-title { font-size: 11px; } 
  .hd-right { gap: 4px; }
  .btn-resumo { padding: 5px 8px; font-size: 11px; }
  .nav-btn { padding: 10px 14px; font-size: 13px; }
  p { font-size:13px; }
  li { font-size:13px; }
}
</style>
</head>
<body>
<div class="bg"></div>

<header class="hd">
  <div class="hd-left">
    <span class="hd-logo">NP2</span>
    <span class="hd-title">JUR VOLUNTÁRIA</span>
  </div>
  <div class="hd-right">
    <button class="btn-resumo" onclick="openModal()">📚 Resumos</button>
    <span class="counter-pill" id="counter">1 / 60</span>
  </div>
</header>

<!-- Modal de Resumos -->
<div class="modal-overlay" id="resumo-modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>📚 Resumo de Véspera</h2>
      <button class="btn-close" onclick="closeModal(event)">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- Injetado via JS -->
    </div>
  </div>
</div>

<main class="main">
  <div class="carousel" id="carousel"></div>
</main>

<footer class="ft">
  <button class="nav-btn btn-prev" onclick="navigate(-1)">← Voltar</button>
  <span class="score-pill" id="score">Acertos: 0</span>
  <button class="nav-btn btn-next" onclick="navigate(1)">Avançar →</button>
</footer>

<script>
const ALL_QUESTIONS = [{"num": 1, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>Em se tratando do procedimento especial de jurisdição voluntária de Interdição, é incorreto afirmar:</p>", "opcoes": {"A": "A interdição pode ser promovida: I - pelo cônjuge ou companheiro; II - pelos parentes ou tutores; III - pelo representante da entidade em que se encontra abrigado o interditando; IV - pelo Ministério Público.", "B": "O interditando poderá constituir advogado, e, caso não o faça, deverá ser nomeado curador especial. Caso o interditando não possua condições financeiras para constituir advogado, o juiz nomeará defensor dativo, sendo vedada a admissão, como assistentes no processo, do seu cônjuge, companheiro ou de qualquer parente sucessível.", "C": "O Ministério Público só promoverá interdição em caso de doença mental grave: I - se o cônjuge ou companheiro, parentes, tutores ou representante da entidade em que se encontra abrigado o interditando não existirem ou não promoverem a interdição; II - se, existindo, forem incapazes o cônjuge ou companheiro, parentes e tutores.", "D": "O Ministério Público, quando não for autor da ação, intervirá sempre como fiscal da ordem jurídica;", "E": "n.d.a."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 2, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>A legitimidade ativa do Ministério Público para a ação de interdição</p>", "opcoes": {"A": "não apresenta qualquer restrição quanto ao fundamento da interdição, e é concorrente com os demais legitimados ordinários.", "B": "é restrita ao caso de doença mental grave, e é subsidiária, pois incidente somente quando os legitimados ordinários não existirem, forem incapazes ou, ainda, caso não promovam a interdição.", "C": "não apresenta qualquer restrição quanto ao fundamento da interdição, mas é subsidiária em relação aos legitimados ordinários, pois incidente somente quando os legitimados ordinários não existirem ou forem incapazes.", "D": "é restrita ao caso de doença mental grave, mas é concorrente em relação aos legitimados ordinários.", "E": "é restrita ao caso de doença mental grave, e é subsidiária, pois incidente somente quando os legitimados ordinários não existirem ou forem incapazes."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 3, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>O Sr. Silveira, de 75 anos de idade, é um grande empresário do ramo imobiliário. Deixou sua cidade natal, Sobral-CE, aos 5 anos de idade e foi com a família para São Paulo, onde conquistou grande patrimônio, fruto de sua bem-sucedida atividade laborativa. Sempre foi dono de uma personalidade muito passiva, maleável, mas com muito senso de liderança e determinação. Manteve-se casado por 40 anos e tem 3 filhos desse relacionamento. Há 5 anos, sem motivação aparente, resolveu se separar e passou a ter relacionamentos amorosos com mulheres muito mais jovens, maior irritabilidade, impulsividade e lapsos de memória. No último mês, adquiriu um imóvel de alto padrão em nome da namorada atual (50 anos mais jovem), cujo relacionamento tem apenas 6 meses, mas que não compromete seu patrimônio. Por não aceitar as orientações e diante de seus comportamentos inadequados e do risco que pode vir a sofrer o seu patrimônio, seus filhos resolveram solicitar uma intervenção judicial.</p>\n<p>Diante do caso, qual é a medida judicial a ser adotada?</p>", "opcoes": {"A": "Inimputabilidade.", "B": "Interdição por incapacidade absoluta.", "C": "Semi-imputabilidade.", "D": "Interdição por incapacidade relativa.", "E": "e) Prodigalidade."}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 4, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>Em ação de responsabilidade civil por ato da Administração Pública, o autor acaba por ser tornar incapaz após ter o Município recorrido da sentença. Descoberta a questão e fixado prazo razoável para que seja sanado o vício de incapacidade processual, sem que o mesmo seja sanado, cabe à autoridade judiciária:</p>", "opcoes": {"A": "encaminhar o processo à Defensoria Pública, para que a mesma atue como curadora especial.", "B": "encaminhar o processo ao Ministério Público, para que o mesmo assuma o polo passivo na defesa do direito do incapaz", "C": "mandar desentranhar as contrarrazões porventura oferecidas pelo autor.", "D": "negar provimento ao recurso.", "E": "extinguir o feito sem resolução de mérito"}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 5, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>Situação hipotética: Luiza Silva, desempregada, solteira, 53 anos de idade, após o falecimento de sua genitora, mudou-se para o imóvel da mãe sob o pretexto de cuidar de seu irmão Manoel, 33 anos de idade, esquizofrênico, com a anuência do irmão mais velho, Raimundo, que a priori sentiu-se agradecido pela generosidade da irmã e sua disponibilidade em cuidar de Manoel.</p>\n<p>Luiza, que já havia se informado sobre a possibilidade de obter, em nome de Manoel, o Benefício de Prestação Continuada da Assistência Social – BPC-LOAS, junto ao INSS, orientada pela Defensoria Pública para requerer a curatela, ajuíza ação com pedido de Interdição do incapaz, fazendo a juntada dos documentos que comprovaram a doença de Manoel, sendo posteriormente deferidos pelo magistrado a interdição e o benefício.</p>\n<p>Após algum tempo, Luiza passou a desvirtuar a finalidade do benefício recebido, que seria a manutenção de condições mínimas de uma vida digna ao curatelado, ignorando seu dever e desrespeitando normas de direito, não se preocupando com a higiene, saúde e alimentação de Manoel, utilizando o dinheiro para comprar bebidas, fazer festas, apropriando-se como se seu fosse.</p>\n<p>Certo dia, ao chegar em casa, Luiza se depara com Manoel em surto, em virtude da interrupção de seu tratamento com antipsicóticos e por falta de acompanhamento médico, uma vez que faltara a todas as consultas agendadas.</p>\n<p>Sobre o instituto da Curatela, e considerando a situação hipotética narrada, é possível afirmar que:</p>", "opcoes": {"A": "Tendo a curatela cunho protetivo da pessoa incapaz, e considerando que Luiza não está cumprindo com o múnus assumido, Raimundo poderá requerer sua remoção da curatela, não havendo imposição da observância da forma legal pelo caráter de urgência e de provisoriedade de que se reveste a medida, mas é exigido para sua concessão que Luiza seja intimada para se defender no processo em obediência ao devido processo legal e ampla defesa.", "B": "Luiza poderá, com a anuência de seu irmão Raimundo, promover a internação de Manoel em um asilo, devendo, no entanto, comprovar que a renda de Manoel está revestida na manutenção de suas despesas.", "C": "Findo o prazo em que Luiza está obrigada a servir como curadora, caso não haja mais interesse, ela terá 10 (dez) dias para requerer sua exoneração do encargo, caso contrário, será reconduzida tacitamente à função.", "D": "A juntada de laudos atualizados e outros documentos devidamente assinados por profissional competente são eficazes para formar o convencimento acerca da necessidade de interdição, o que não obsta ao magistrado solicitar novo laudo em caso de suspeita acerca da veracidade dos documentos.", "E": "O Ministério Público, como defensor dos direitos individuais indisponíveis, também seria considerado legitimado, em concorrência com os demais, para promover a interdição de Manoel, dada a necessidade de ordem social."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 6, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>A requisição judicial de interdição se inicia com laudo emitido por IML, onde existente.</p>", "opcoes": {"A": "O tutor ou curador deve prestar o compromisso por termo em livro rubricado pelo juiz e a assunção da administração dos bens do incapaz, a partir de então, pelo tutor/curador.", "B": "A prestação de compromisso poderá ser procedida através de registro eletrônico, desde que adotado de autenticação perante o tribunal ao qual subordinado o juízo;", "C": "O juiz terá de decidir, de plano, acerca do pedido de escusa apresentado pelo tutor ou curador no desígnio de eximirem-se do encargo. Não o admitindo, impõe-se o exercício até que sobrevenha a dispensa por sentença transitada em julgado.", "D": "Tanto o tutor quanto o curador têm a obrigação de prestar contas relativas ao exercício do seu múnus, o que deve ser procedido nos próprios autos em que nomeados. A não prestação das contas os sujeita à remoção do encargo.", "E": "n.d.a."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 7, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>À luz do Código de Processo Civil, assinale a opção correta acerca da interdição nos casos de incapacidade civil.</p>", "opcoes": {"A": "A perícia do interditando poderá ser realizada por equipe multidisciplinar.", "B": "O juiz raramente entrevista o interditando, fundamentando sua decisão, em geral, no laudo pericial.", "C": "Caso exista dúvida quanto à capacidade de entendimento e determinação do interditando, o juiz terá de determinar a realização de perícia.", "D": "O laudo pericial deverá indicar as limitações do interditando quanto ao entendimento e determinação, sem se referir aos atos para os quais haverá necessidade de curatela.", "E": "A requisição judicial de interdição se inicia com laudo emitido por IML, onde existente."}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 8, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>Assinale a alternativa INCORRETA. Qualquer interessado ou o Ministério Público promoverá em juízo a extinção da fundação quando:</p>", "opcoes": {"A": "for impossível a sua manutenção", "B": "em caso de abuso da personalidade jurídica", "C": "se tornar ilícito o seu objeto", "D": "vencer o prazo de sua existência", "E": "n.d.a."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 9, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>Assinale a alternativa INCORRETA</p>", "opcoes": {"A": "Incumbe ao Ministério Público ou a quem tenha legítimo interesse requerer, nos casos previstos em lei, a remoção do tutor ou do curador.", "B": "Em caso de extrema gravidade, o juiz poderá suspender o tutor ou o curador do exercício de suas funções, nomeando substituto interino.", "C": "Caso o tutor ou o curador não requeira a exoneração do encargo dentro dos 10 (dez) dias seguintes à expiração do termo, entender-se-á reconduzido, salvo se o juiz o dispensar.", "D": "Prestado o compromisso, o tutor ou o curador assume a administração dos bens do tutelado ou do interditado", "E": "O tutor ou o curador será intimado a prestar compromisso no prazo de 15 (quinze) dias contado da nomeação feita em conformidade com a lei"}, "gabarito": "E", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 10, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>Assinale a alternativa INCORRETA</p>", "opcoes": {"A": "O tutor ou o curador será citado para contestar a arguição no prazo de 5 (cinco) dias, findo o qual observar-se-á o procedimento comum", "B": "Caso o tutor ou o curador não requeira a exoneração do encargo dentro dos 5 (cinco) dias seguintes à expiração do termo, entender-se-á reconduzido, salvo se o juiz o dispensar.", "C": "O juiz decidirá de plano o pedido de escusa, e, não o admitindo, exercerá o nomeado a tutela ou a curatela enquanto não for dispensado por sentença transitada em julgado.", "D": "Cessada a tutela ou a curatela, é indispensável a prestação de contas pelo tutor ou pelo curador, na forma da lei civil.", "E": "o tutor ou o curador será intimado a prestar compromisso no prazo de 5 (cinco) dias contado da intimação do despacho que mandar cumprir o testamento ou o instrumento público que o houver instituído"}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 11, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>Assinale a alternativa incorreta. A interdição não pode ser promovida:</p>", "opcoes": {"A": "pelo exequente ou tutores", "B": "pelo Ministério Público", "C": "pelo representante da entidade em que se encontra abrigado o interditando;", "D": "pelos parentes", "E": "pelo cônjuge ou companheiro"}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 12, "tema": "Módulo 5 - Interdição e Curatela", "enunciado": "<p>Assinale a alternativa INCORRETA. O juiz decidirá sobre a aprovação do estatuto das fundações e de suas alterações sempre que o requeira o interessado, quando:</p>", "opcoes": {"A": "antes de suprir a aprovação, o juiz poderá mandar fazer no estatuto modificações a fim de adaptá-lo ao objetivo do instituidor.", "B": "o interessado discordar do estatuto elaborado pelo Ministério Público", "C": "quando a alteração do estatudo não houver sido aprovada por votação unânime", "D": "ela for negada previamente pelo Ministério Público ou por este forem exigidas modificações com as quais o interessado não concorde", "E": "n.d.a"}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Curatela</strong> é uma medida de proteção de caráter excepcional e extraordinário, proporcional às necessidades e circunstâncias da pessoa, com foco em resguardar seu patrimônio e negócios.</p>\n\n<p>Lembre-se: O Estatuto da Pessoa com Deficiência reconfigurou o sistema de incapacidades.</p>", "fundamentacao": "<p>A regra encontra abrigo no <strong>Estatuto da Pessoa com Deficiência (Lei 13.146/15)</strong> e nos <strong>arts. 747 e seguintes do CPC/2015</strong>.</p>\n\n<p>A interdição só é válida para gerir negócios e garantir o sustento material.</p>", "dica": "<p><strong>Atenção!</strong> A deficiência, física ou mental, <strong>não</strong> afeta a plena capacidade civil para o casamento, sexualidade ou direito ao voto. O MP atua apenas subsidiariamente, em casos de doença mental grave ou conflito de interesses!</p>"}, {"num": 13, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Raquel, servidora pública federal, pretende ajuizar ação em face da União, pleiteando a anulação de seu ato de demissão, bem como requerendo a condenação da ré ao pagamento de indenização por danos morais, no valor de R$ 50.000,00 (cinquenta mil reais), tendo em vista o sofrimento causado por ato que considera ilegal.</p>\n<p>Na qualidade de advogado(a) de Raquel, a respeito do rito a ser seguido na hipótese, assinale a afirmativa correta.</p>", "opcoes": {"A": "A ação deverá seguir o rito dos Juizados Especiais Federais (Lei nº 10.259/01), uma vez que o valor da causa é inferior a 60 (sessenta) salários mínimos.", "B": "Tendo em vista que a ré é um ente público, aplica-se à hipótese o rito disposto na Lei nº 12.153/09, que regulamenta os Juizados Especiais da Fazenda Pública.", "C": "Poderá ser utilizado tanto o rito comum como o dos Juizados Especiais, já que, no foro onde estiver instalada a Vara do Juizado Especial, sua competência é relativa.", "D": "O rito a ser observado será o rito comum, pois não é de competência dos Juizados Especiais pretensão que impugna pena de demissão imposta a servidor público civil.", "E": "n.d.a."}, "gabarito": "D", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 14, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Luciana, por meio de seu advogado, propôs demanda em face de Carlos, perante determinado Juizado Especial Cível, na qual pediu, a título de indenização por danos materiais, a condenação do réu ao pagamento de R$ 20.000,00. Ao julgar parcialmente procedente o pedido, o juízo a quo condenou o demandado ao pagamento de R$ 15.000,00. Luciana se conformou com a decisão, ao passo que Carlos recorreu, a fim de diminuir o valor da condenação para R$10.000,00 e, bem assim, requereu a condenação da recorrida ao pagamento de custas e honorários. Embora tenha diminuído o valor da condenação para R$ 10.000,00, conforme requerido no recurso, o órgão ad quem não condenou Luciana ao pagamento de custas e honorários.</p>\n<p>Diante de tal quadro, é correto afirmar, especificamente no que se refere às custas e aos honorários, que</p>", "opcoes": {"A": "o órgão recursal errou, pois a gratuidade prevista pela Lei nº 9.099/95 só abrange o primeiro grau de jurisdição.", "B": "o órgão ad quem acertou, uma vez que, no âmbito do segundo grau, somente o recorrente vencido pode arcar com a sucumbência.", "C": "o órgão ad quem acertou, uma vez que, no âmbito do segundo grau, somente é possível condenação em custas e honorários se houver litigância de má-fé.", "D": "o órgão recursal agiu corretamente, pois os processos que tramitam sob o rito da Lei nº 9.099/95 são gratuitos, indistintamente, em qualquer grau de jurisdição.", "E": "n.d.a."}, "gabarito": "B", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 15, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Arthur ajuizou ação perante o Juizado Especial Cível da Comarca do Rio de Janeiro, com o objetivo de obter reparação por danos materiais, em razão de falha na prestação de serviços pela sociedade empresária Consultex.</p>\n<p>A sentença de improcedência dos pedidos iniciais foi publicada, mas não apreciou juridicamente um argumento relevante suscitado na inicial, desconsiderando, em sua fundamentação, importante prova do nexo de causalidade. Arthur pretende opor embargos de declaração para ver sanada tal omissão.</p>\n<p>Diante de tal cenário, assinale a afirmativa correta.</p>", "opcoes": {"A": "Arthur poderá opor embargos de declaração, suspendendo o prazo para interposição de recurso para a Turma Recursal.", "B": "Os embargos não interrompem ou suspendem o prazo para interposição de recurso para a Turma Recursal, de modo que Arthur deverá optar entre os embargos ou o recurso, sob pena de preclusão.", "C": "Eventuais embargos de declaração interpostos por Arthur interromperão o prazo para interposição de recurso para a Turma Recursal.", "D": "Arthur não deverá interpor embargos de declaração pois estes não são cabíveis no âmbito de Juizados Especiais.", "E": "n.d.a."}, "gabarito": "C", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 16, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Nos Juizados Especiais Cíveis</p>", "opcoes": {"A": "cabem recursos de suas sentenças a serem recebidos no efeito devolutivo e suspensivo como regra geral, não havendo assim execução provisória do julgado.", "B": "não se admite, em seus processos, qualquer forma de intervenção de terceiro, assistência ou litisconsórcio.", "C": "só se admitem ações possessórias sobre bens móveis, mas não sobre bens imóveis.", "D": "em seus processos o mandato ao advogado poderá ser verbal, inclusive quanto aos poderes especiais.", "E": "a prova oral será produzida na audiência de instrução e julgamento, ainda que não requerida previamente, podendo o Juiz limitar ou excluir o que considerar excessivo, impertinente ou protelatório."}, "gabarito": "E", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 17, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>De acordo com a Lei n.º 9.099/1995, os juizados especiais cíveis têm competência para julgar</p>", "opcoes": {"A": "ações cíveis, desde que o valor da causa não exceda vinte salários-mínimos.", "B": "ações de despejo para uso próprio.", "C": "ações possessórias sobre bens imóveis, independentemente do valor da causa.", "D": "ações de natureza alimentar.", "E": "ações de interesse da fazenda pública."}, "gabarito": "B", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 18, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Com vistas a suspender episodicamente a eficácia do ato constitutivo de determinada empresa, João, credor de um dos sócios do empreendimento, ajuizou incidente de desconsideração da personalidade jurídica para tentar atingir a cota-parte do sócio devedor.</p>\n<p>Com relação a essa situação hipotética, assinale a opção correta.</p>", "opcoes": {"A": "Caso a ação de cobrança de João esteja em fase de cumprimento de sentença, o juiz deverá inadmitir o incidente.", "B": "Sendo o caso de desconsideração inversa da personalidade jurídica, o juiz deverá inadmitir a medida processual proposta por João.", "C": "Se o juiz decidir o incidente em um dos capítulos da sentença, o recurso cabível contra a parte específica da decisão é o agravo de instrumento.", "D": "A desistência do incidente por João implicaria na assunção da demanda pelo Ministério Público, independentemente de intervenção prévia do parquet na causa.", "E": "Ainda que seja hipótese de intervenção de terceiros, o incidente poderá ser admitido se a causa estiver em tramitação nos juizados especiais."}, "gabarito": "E", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 19, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>São princípios informadores específicos do processo nos Juizados Especiais Cíveis, segundo o disposto na Lei n. 9.099/95:</p>", "opcoes": {"A": "Oralidade, simplicidade, informalidade, economia processual, boa-fé e confidencialidade.", "B": "Oralidade, simplicidade, informalidade, economia processual, boa-fé, celeridade e confidencialidade.", "C": "Oralidade, simplicidade, informalidade, economia processual e celeridade.", "D": "Oralidade, simplicidade, informalidade, economia processual e boa-fé.", "E": "n.d.a."}, "gabarito": "C", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 20, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Sobre a revelia, resposta do réu e audiência de instrução e julgamento nos Juizados Especiais Cíveis, marque a alternativa INCORRETA.</p>", "opcoes": {"A": "A contestação, que será oral ou escrita, conterá toda matéria de defesa, inclusive, se for o caso, arguição de suspeição ou impedimento do Juiz.", "B": "Na audiência de instrução e julgamento, sobre os documentos apresentados por uma das partes, manifestar-se-á imediatamente a parte contrária, sem interrupção da audiência.", "C": "Na audiência de instrução e julgamento serão decididos de plano todos os incidentes que possam interferir no regular prosseguimento da audiência. As demais questões serão decididas na sentença.", "D": "Não comparecendo o demandado à sessão de conciliação ou à audiência de instrução e julgamento, reputar-se-ão verdadeiros os fatos alegados no pedido inicial, salvo se o contrário resultar da convicção do Juiz.", "E": "n.d.a."}, "gabarito": "A", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 21, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Sobre a competência dos Juizados Especiais Cíveis, analise as seguintes afirmativas.</p>\n<p>I. O processamento da ação perante o Juizado Especial Estadual é opção do autor, que pode, se preferir, ajuizar sua demanda perante a Justiça Comum.</p>\n<p>II. Com o advento do Novo Código de Processo Civil de 2015, não são mais da competência dos Juizados Especiais Cíveis as causas enumeradas no art. 275, II, do Código de Processo Civil anterior.</p>\n<p>III. A necessidade de produção de prova pericial, por si só, não influi na definição da competência dos Juizados Especiais.</p>\n<p>IV. Compete ao Juizado Especial a execução de seus próprios julgados, independente da quantia a ser executada, desde que tenha sido observado o valor de alçada na ocasião da propositura da ação.</p>\n<p>V. Em se tratando de litisconsórcio ativo facultativo, para que se fixe a competência dos Juizados Especiais, deve ser considerado o valor da causa individualmente por autor, não importando se a soma ultrapassa o valor de alçada.</p>\n<p>Estão corretas apenas as afirmativas</p>", "opcoes": {"A": "I, II e III.", "B": "II, IV e V.", "C": "I, III, IV e V.", "D": "II, III, IV e V.", "E": "I, II, III, IV e V."}, "gabarito": "C", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 22, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Entre outros objetivos, os juizados especiais cíveis estaduais buscam extrair do processo o máximo de proveito com o mínimo de dispêndio de tempo e energias, razão pela qual, por exemplo, realiza a colheita de prova pericial de forma simplificada e a oitiva do perito em audiência. Tal objetivo é consoante com o princípio da</p>", "opcoes": {"A": "simplicidade.", "B": "economia processual.", "C": "oralidade.", "D": "informalidade.", "E": "n.d.a."}, "gabarito": "B", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 23, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Com relação aos Juizados Especiais, assinale a alternativa correta.</p>", "opcoes": {"A": "Não poderão ser partes o incapaz, o preso, a massa falida, o insolvente civil e as sociedades de crédito ao microempreendedor.", "B": "Os atos processuais serão públicos e poderão realizar-se em horário noturno, conforme dispuserem as normas de organização judiciária.", "C": "É admissível a denunciação da lide àquele que estiver obrigado, por lei ou contrato, a indenizar, em ação regressiva, o prejuízo de quem for vencido no processo.", "D": "É cabível o incidente de uniformização de jurisprudência quando houver divergência entre as decisões proferidas por Turmas Recursais sobre questões de direito processual.", "E": "No Juizado Especial Cível, a decisão de mérito, transitada em julgado, pode ser rescindida quando se verificar que foi proferida por força de prevaricação, concussão ou corrupção do juiz."}, "gabarito": "B", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 24, "tema": "Módulo 6 - Juizados Especiais Cíveis", "enunciado": "<p>Os juízes leigos do Juizado Especial Cível</p>", "opcoes": {"A": "serão indicados para auxiliarem nas Turmas Recursais, sob o critério de antiguidade e merecimento.", "B": "desempenham limitadamente as funções do juiz togado e ainda podem ser acionados caso as partes aceitem resolver o conflito usando solução arbitral.", "C": "podem exercer a advocacia perante os Juizados Especiais da Fazenda Pública em qualquer Comarca.", "D": "devem ser recrutados, preferencialmente por concurso público, dentre quaisquer inscritos como advogados na OAB.", "E": "exercem a função em caráter temporário, com vínculo estatutário, o que pressupõe a capacitação prévia e continuada, por curso ministrado pelo Tribunal de Justiça."}, "gabarito": "B", "core": true, "sintese": "<p>Os Juizados Especiais Cíveis (JEC) são voltados para causas simples e operam sob os princípios da <strong>oralidade, simplicidade, informalidade, economia processual e celeridade</strong>.</p>", "fundamentacao": "<p>Regrado inteiramente pela <strong>Lei 9.099/95 (arts. 2º ao 9º)</strong>.</p>\n\n<p>A competência é limitada a causas de <strong>até 40 salários mínimos</strong>.</p>", "dica": "<p><strong>Prazo Fatal!</strong> No JEC, o Recurso Inominado (que substitui a Apelação) possui prazo de <strong>10 dias úteis</strong> (e não 15!). O preparo deve ser feito de forma irrevogável em até <strong>48h</strong> após a interposição.</p>"}, {"num": 25, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>De acordo com a Lei n° 10.259/2001, compete ao Juizado Especial Federal Cível processar, conciliar e julgar causas de competência da Justiça Federal até o valor de sessenta salários mínimos, com algumas exceções. NÃO são excluídas da competência do Juizado Especial Federal Cível as ações</p>", "opcoes": {"A": "de mandado de segurança.", "B": "que versarem sobre bens imóveis da União.", "C": "que versarem sobre direitos ou interesses difusos.", "D": "de desapropriação de bens móveis.", "E": "para a anulação de lançamento fiscal."}, "gabarito": "E", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 26, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>Sobre Juizados Especiais Cíveis da Justiça Federal, é correto afirmar:</p>", "opcoes": {"A": "São regidos pela Lei no 10.259/2001 e a eles não se aplica a Lei no 9.099/1995, que dispõe sobre os Juizados Especiais Cíveis e Criminais da Justiça Estadual.", "B": "Compete ao Juizado Especial Cível da Justiça Federal processar, conciliar e julgar causas de competência da Justiça Federal até o valor máximo de quarenta salários mínimos, bem como executar as suas sentenças.", "C": "Autarquias e fundações federais podem ser parte no Juizado Especial Cível da Justiça Federal, como autoras, desde que a causa respeite o valor de alçada.", "D": "No foro onde estiver instalada Vara do Juizado Especial Cível da Justiça Federal, a sua competência é relativa.", "E": "Excluem-se da competência do Juizado Especial Cível da Justiça Federal as ações que tenham por objeto a anulação ou cancelamento de ato administrativo federal, salvo o de natureza previdenciária e o de lançamento fiscal."}, "gabarito": "E", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 27, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>No âmbito do Juizado Especial Federal, a citação das pessoas jurídicas de direito público, para audiência de conciliação, deve ser efetuada com antecedência mínima de</p>", "opcoes": {"A": "30 (trinta) dias.", "B": "15 (quinze) dias.", "C": "48 (quarenta e oito) horas.", "D": "5 (cinco) dias.", "E": "72 (setenta e duas) horas."}, "gabarito": "A", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 28, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>Em relação aos juizados especiais federais, é correto afirmar-se:</p>", "opcoes": {"A": "não se deve admitir, em hipótese alguma, a impetração de mandado de segurança contra as decisões proferidas nos juizados.", "B": "deve-se admitir a impetração de mandado de segurança contra as decisões interlocutórias proferidas nos juizados, como sucedâneo do agravo de instrumento e apenas nas hipóteses em que este seria cabível.", "C": "os mandados de segurança impetrados contra decisões proferidas pelos juizados de primeira instância devem ser apreciados pelo Tribunal Regional Federal.", "D": "os mandados de segurança impetrados contra decisões proferidas pelos juizados de primeira instância devem ser apreciados pelas Turmas Recursais.", "E": "os mandados de segurança impetrados contra decisões proferidas pelos juizados de primeira instância devem ser apreciados por Juiz Federal Titular de Vara Federal."}, "gabarito": "D", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 29, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>Assinale a alternativa CORRETA:</p>", "opcoes": {"A": "Tramitando determinada demanda previdenciária nos Juizados Especiais Federais e se fazendo necessária a realização de prova técnica para o deslinde da controvérsia, se, após a apresentação do laudo médico, as partes controverterem sobre as conclusões científicas do perito nomeado, deverá o Juízo declinar da competência para processo e julgamento do feito para a vara federal comum, sob o argumento da complexidade da matéria envolvida.", "B": "Tramitando determinada demanda previdenciária nos Juizados Especiais Federais, após a prolação de sentença de improcedência que se fundou em laudo médico, na análise do recurso contra ela interposto, poderá monocraticamente o relator, na Turma Recursal, ao não se sentir suficientemente esclarecido pelas conclusões do perito, determinar a realização de nova perícia, sem, entretanto, anular o julgado, com fundamento na aplicação subsidiária do disposto no CPC.", "C": "Tramitando determinada demanda previdenciária nos Juizados Especiais Federais, após a realização de perícia médica que concluiu contrariamente ao alegado pelo autor, é direito subjetivo seu a realização de novo exame técnico, de forma a subsidiar o deslinde da controvérsia.", "D": "Tramitando determinada demanda previdenciária nos Juizados Especiais Federais e havendo a condenação do INSS na implantação de determinado benefício e no pagamento dos valores atrasados é possível, se apurado que o valor devido supera os 60 (sessenta) salários mínimos, que o exequente opte pela expedição de RPV no valor do limite máximo e pela expedição de precatório dito complementar para pagamento do montante excedente.", "E": "n.d.a."}, "gabarito": "B", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 30, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>Quais os critérios orientam os processos que tramitam nos juizados especiais:</p>", "opcoes": {"A": "Oralidade e simplicidade.", "B": "Economia processual e formalidade.", "C": "Formalidade e morosidade.", "D": "Celeridade e complexidade.", "E": "n.d.a."}, "gabarito": "A", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 31, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>O juizado especial cível da justiça federal é competente para processar e julgar</p>", "opcoes": {"A": "causa entre Estado estrangeiro e pessoa domiciliada no Brasil.", "B": "ação de anulação de ato administrativo federal de lançamento fiscal.", "C": "ação sobre bem imóvel da União", "D": "mandado de segurança referente a disputa sobre direitos indígenas.", "E": "causa entre organismo internacional e município brasileiro."}, "gabarito": "B", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 32, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>No âmbito dos Juizados Especiais Federais, regulado pela Lei no. 10.259-2001, houve uma diminuição das prerrogativas conferidas à Fazenda Pública, mas houve a manutenção do seguinte instituto:</p>", "opcoes": {"A": "precatório", "B": "remessa necessária", "C": "prazos diferenciados", "D": "requisição de pequeno valor", "E": "intimação exclusivamente pessoal"}, "gabarito": "D", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 33, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>Dadas as assertivas abaixo, assinale a alternativa correta.</p>\n<p>Acerca dos Juizados Especiais Federais:</p>\n<p>I. Compete ao Tribunal Regional Federal decidir os conflitos de competência entre juizado especial federal e juízo federal da mesma seção judiciária.</p>\n<p>II. Compete à turma recursal processar e julgar o mandado de segurança contra ato de juizado especial, substitutivo de recurso.</p>\n<p>III. O princípio da reserva de plenário não se aplica no âmbito dos juizados de pequenas causas e dos juizados especiais em geral.</p>", "opcoes": {"A": "Estão corretas apenas as assertivas I e II.", "B": "Estão corretas apenas as assertivas II e III.", "C": "Estão corretas todas as assertivas.", "D": "Está incorreta apenas a assertiva II.", "E": "Estão incorretas apenas as assertivas II e III."}, "gabarito": "C", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 34, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>Sobre os juizados especiais da Fazenda Pública, pode-se corretamente afirmar:</p>", "opcoes": {"A": "a sua competência é relativa, podendo as partes ajuizarem demanda na justiça comum, se assim o desejarem.", "B": "poderá haver conciliação, transação e desistência pela Fazenda Pública, nos termos e nas hipóteses previstas na lei do respectivo ente da Federação.", "C": "a Fazenda Pública terá prazo em dobro para recorrer no âmbito dos juizados especiais da Fazenda Pública.", "D": "há reexame necessário em caso de condenação da Fazenda Pública.", "E": "as causas que tiverem por objeto a impugnação de demissão de servidor público devem ser propostas no juizado especial, se o somatório dos 12 últimos vencimentos for inferior a 60 salários mínimos."}, "gabarito": "B", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 35, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>Nos exatos termos da Lei do Juizado Especial da Fazenda Pública, assinale a alternativa correta.</p>", "opcoes": {"A": "As causas que tenham como objeto a impugnação da pena de demissão imposta a servidores públicos civis podem, perante ele, ser ajuizadas.", "B": "No foro onde estiver instalado, a sua competência é relativa.", "C": "O juiz poderá, de ofício ou a requerimento das partes, deferir quaisquer providências cautelares e antecipatórias no curso do processo, para evitar dano de difícil ou de incerta reparação.", "D": "Podem ser partes como réus os Municípios, bem como suas autarquias, fundações, empresas públicas e sociedades de economia mista.", "E": "Deve a citação para a audiência de conciliação ser efetuada com antecedência mínima de 15 (quinze) dias"}, "gabarito": "C", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 36, "tema": "Módulo 7 - JEF e JEFP", "enunciado": "<p>No que respeita às disposições da Lei n° 12.153/2009, é correto afirmar que</p>", "opcoes": {"A": "haverá prazo diferenciado para a prática de qualquer ato processual pelas pessoas jurídicas de direito público, inclusive para interposição de recursos, devendo a citação para a audiência de conciliação ser efetuada com antecedência mínima de 30 (trinta) dias.", "B": "os Estados, o Distrito Federal e os Municípios podem ser partes no Juizado Especial da Fazenda Pública, na qualidade de autores ou réus.", "C": "para efetuar o exame técnico necessário à conciliação ou ao julgamento da causa, o juiz nomeará pessoa habilitada, que apresentará o laudo até 15 dias antes da audiência.", "D": "as execuções fiscais não estão incluídas na competência do Juizado Especial da Fazenda Pública.", "E": "nas causas sujeitas ao Juizado Especial da Fazenda Pública, nas quais a Fazenda Pública seja parte vencida, haverá reexame necessário."}, "gabarito": "D", "core": true, "sintese": "<p>Os Juizados Especiais Federais (JEF) e da Fazenda Pública (JEFP) lidam diretamente com litígios contra Entes Federativos e Autarquias, com competência absoluta até 60 salários mínimos.</p>", "fundamentacao": "<p>Tratam-se da <strong>Lei 10.259/01 (JEF)</strong> e <strong>Lei 12.153/09 (JEFP)</strong>.</p>", "dica": "<p><strong>Cuidado com a Fazenda!</strong> Nesses juizados <strong>NÃO</strong> existe o reexame necessário (remessa obrigatória ao Tribunal), e o pagamento do Estado/União é feito de forma célere via <strong>RPV</strong> (Requisição de Pequeno Valor), dispensando os precatórios.</p>"}, {"num": 37, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>A sociedade empresária Sucesso veiculou propaganda enganosa acerca de um determinado produto, com especificações distintas daquelas indicadas no material publicitário. Aproximadamente 500.000 consumidores, dentre os quais alguns hipossuficientes, compraram o produto. Diante disso, a Associação de Defesa do Consumidor, constituída há 10 anos, cogitou a possibilidade de ajuizar ação civil pública, com base na Lei nº 7.347/85, para obter indenização para tais consumidores.</p>\n<p>Diante dessas informações, assinale a afirmativa correta.</p>", "opcoes": {"A": "O Ministério Público é parte ilegítima para a propositura da ação civil pública.", "B": "A Associação de Defesa do Consumidor pode propor a ação civil pública.", "C": "Qualquer consumidor lesado pode propor a ação civil pública.", "D": "A propositura da ação civil pública pela Defensoria dispensa a participação do Ministério Público no processo.", "E": "n.d.a."}, "gabarito": "B", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 38, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>Foi impetrado mandado de segurança contra decisão judicial. Entretanto a decisão impugnada pelo mandado de segurança transitou em julgado. De acordo com o entendimento atual da Jurisprudência do Superior Tribunal de Justiça, o mandado de segurança deve</p>", "opcoes": {"A": "ter seu mérito apreciado independentemente de superveniente trânsito em julgado da decisão questionada pelo mandamus.", "B": "ser julgado prejudicado, em razão do trânsito em julgado da decisão impugnada.", "C": "ter seu mérito julgado e deverá ser indeferido, pois o mandamus não pode ser utilizado como sucedâneo da ação rescisória.", "D": "ser julgado sem resolução do mérito, em razão da coisa julgada.", "E": "ser convertido em ação rescisória."}, "gabarito": "B", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 39, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>Assinale a alternativa que traz o conteúdo de uma súmula do STJ em vigência.</p>", "opcoes": {"A": "A teoria da encampação é aplicada no mandado de segurança quando presentes, cumulativamente, os seguintes requisitos: a) existência de vínculo hierárquico entre a autoridade que prestou informações e a que ordenou a prática do ato impugnado; b) manifestação a respeito do mérito nas informações prestadas; e c) ausência de modificação de competência estabelecida na Constituição Federal.", "B": "O Ministério Público não tem legitimidade para pleitear, em ação civil pública, a indenização decorrente do DPVAT em benefício do segurado.", "C": "Compete ao Superior Tribunal de Justiça decidir os conflitos de competência entre juizado especial federal e juízo federal, ainda que da mesma seção judiciária.", "D": "É inadmissível ação declaratória, visando a obter certeza quanto à exata interpretação de cláusula contratual.", "E": "A Câmara de Vereadores possui personalidade jurídica e personalidade judiciária, podendo demandar em juízo para defender os seus direitos institucionais e outros que se constituam coletivos lato sensu."}, "gabarito": "A", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 40, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>Sobre as ações constitucionais, assinale a alternativa correta.</p>", "opcoes": {"A": "A ação civil pública poderá ter por objeto a condenação em dinheiro ou o cumprimento de obrigação de fazer ou não fazer.", "B": "A sentença de improcedência da ação popular por deficiência de prova terá eficácia de coisa julgada erga omnes.", "C": "Cabe mandado de segurança contra os atos de gestão comercial praticados pelos administradores de empresas públicas.", "D": "De uma decisão denegatória de segurança decidida em única instância pelo Tribunal de Justiça do Estado do Paraná caberá recurso especial ao Superior Tribunal de Justiça.", "E": "Do indeferimento da petição inicial de mandado de segurança pelo juiz de primeiro grau caberá recurso de agravo."}, "gabarito": "A", "core": true, "sintese": "<p>O <strong>Mandado de Segurança</strong> combate atos coatores de autoridade pública. A <strong>Ação Civil Pública</strong> tem por norte proteger direitos difusos, coletivos e os chamados individuais homogêneos.</p>", "fundamentacao": "<p>Aplicam-se a <strong>Lei 7.347/85 (ACP)</strong> e <strong>Lei 12.016/09 (MS)</strong>.</p>\n\n<p>Para MS, exige-se direito líquido e certo.</p>", "dica": "<p><strong>Súmulas Matadoras:</strong></p>\n<ul><li><strong>Súmula 268 STF:</strong> Não cabe MS contra decisão com trânsito em julgado.</li><li><strong>STJ na ACP:</strong> Por simetria processual, o MP vencedor não ganha honorários contra o réu.</li></ul>"}, {"num": 41, "tema": "Módulo 8 - Ação Civil Pública e MS", "enunciado": "<p>O Ministério Público ajuizou ação civil pública contra determinada empresa e seus sócios, visando tutelar direitos de consumidores lesados por contratos celebrados para a prática de esquema de pirâmide financeira. A sentença condenatória na ação coletiva foi publicada em 5/1/2003 e, após recurso, transitou em julgado em 2/6/2005. Em 6/7/2012, um consumidor beneficiário da referida demanda apresentou execução individual da sentença coletiva.</p>\n<p>Nessa situação hipotética, de acordo com o entendimento do STJ, é correto afirmar que, à época da propositura da execução individual pelo beneficiário, a sua pretensão</p>", "opcoes": {"A": "estava prescrita desde o transcurso de cinco anos após o trânsito em julgado da sentença coletiva.", "B": "não estava prescrita, e só será assim considerada após o transcurso de dez anos do trânsito em julga

g>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 44, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>A cobrança pelo uso de recursos hídricos visa:</p>", "opcoes": {"A": "instituir a água como bem econômico e impor ao usuário medidas restritivas de direitos quanto à outorga e à fruição dos recursos hídricos.", "B": "incentivar a privatização dos mecanismos de distribuição da água, bem como das estações de tratamento.", "C": "incentivar o reúso das águas servidas na produção de ração animal.", "D": "estabelecer limites diários para a captação das águas superficiais.", "E": "obter recursos financeiros para o financiamento dos programas e das intervenções contempladas nos planos de recursos hídricos."}, "gabarito": "A", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 45, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>Os recursos hídricos</p>", "opcoes": {"A": "são bens de domínio público exploráveis em regime de monopólio, objeto de concessão a empresas públicas de saneamento.", "B": "são bens de uso comum do povo e, como tal, de livre apropriação e utilização por qualquer cidadão.", "C": "são bens de uso comum do povo e, embora não possam ser objeto de propriedade privada, compete ao Poder Público disciplinar a sua utilização gratuita por qualquer cidadão.", "D": "constituem bens dominiais da União, que como tal poderá instituir taxas para sua utilização pelos particulares.", "E": "são bens de domínio público cuja utilização está sujeita a regime de outorga, bem como à cobrança pelo seu uso."}, "gabarito": "E", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 46, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>A respeito da cobrança pelo uso da água, não é correto afirmar:</p>", "opcoes": {"A": "Tem por objetivo a conscientização do usuário, dando a ele uma real indicação do valor da água.", "B": "Visa incentivar o uso racional da água.", "C": "O dinheiro arrecadado pelo uso dos recursos hídricos deverá ser utilizado no financiamento dos programas e intervenções contemplados nos planos de recursos hídricos.", "D": "O valor cobrado pelo uso da água deve ser definido pelo Poder Público.", "E": "Não é permitida a cobrança de qualquer valor pelo uso da água, de usuários que tenham renda mensal inferior a 03 (três) salários mínimos."}, "gabarito": "E", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 47, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>Quanto à outorga de direito de uso de recursos hídricos, assinale a opção correta:</p>", "opcoes": {"A": "A outorga é de competência exclusiva da Agência Nacional de Águas.", "B": "Em situações de escassez, o uso prioritário dos recursos hídricos deve ser destinado ao consumo humano e à dessedentação de animais e, em seguida, às prioridades de uso estabelecidas no Plano de Recursos Hídricos aplicável a cada corpo hídrico.", "C": "A outorga só será suspensa nos casos de não cumprimento, pelo outorgado, dos termos estabelecidos ou de necessidade premente de água para atender a situações de calamidade, sempre mediante processo administrativo em que se assegure ampla defesa.", "D": "A outorga deverá observar o uso específico para o qual o corpo hídrico tiver sido destinado, vedado o seu uso múltiplo.", "E": "Desde que respeite a classe em que o corpo de água estiver enquadrado, a outorga não fica condicionada às prioridades de uso."}, "gabarito": "B", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 48, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>Acerca dos fundamentos que dão base à PNRH, assinale a opção correta:</p>", "opcoes": {"A": "Sendo a água bem de domínio público e recurso natural limitado, dotado de valor econômico, o uso prioritário dos recursos hídricos, em situações de escassez, consiste no consumo humano e na dessedentação de animais.", "B": "A gestão dos recursos hídricos deve sempre proporcionar o uso múltiplo das águas, sendo o município a unidade territorial escolhida para a implementação da PNRH e atuação do SNGRH.", "C": "O comitê de bacias, órgão consultivo e deliberativo do SNGRH, tem como centro administrativo a Secretaria Executiva do Instituto Chico Mendes para a Biodiversidade.", "D": "A gestão dos recursos hídricos deve proporcionar meios efetivos de prevenção e defesa contra as mudanças climáticas capazes de ocasionar degeneração na qualidade das águas e perda de aquíferos decorrentes do uso inadequado dos recursos naturais.", "E": "A gestão dos recursos hídricos deve ser centralizada, para melhor gerenciamento, cabendo à União viabilizar a participação dos usuários e das comunidades no processo de tomada de decisões quanto aos usos múltiplos da água."}, "gabarito": "A", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 49, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>A cobrança pelo uso de recursos hídricos visa:</p>", "opcoes": {"A": "instituir a água como bem econômico e impor ao usuário medidas restritivas de direitos quanto à outorga e à fruição dos recursos hídricos.", "B": "incentivar a privatização dos mecanismos de distribuição da água, bem como das estações de tratamento.", "C": "incentivar o reúso das águas servidas na produção de ração animal.", "D": "estabelecer limites diários para a captação das águas superficiais.", "E": "obter recursos financeiros para o financiamento dos programas e das intervenções contempladas nos planos de recursos hídricos."}, "gabarito": "E", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 50, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>No que tange aos recursos hídricos, é possível afirmar que</p>", "opcoes": {"A": "a) a água é um recurso natural ilimitado, dotado de valor econômico.", "B": "b) em situações de escassez, o uso prioritário da água deve ser o consumo humano e a dessedentação de animais.", "C": "c) a extração da água de aquífero subterrâneo para consumo final ou insumo de processo produtivo independe de outorga pelo Poder Público.", "D": "d) não será cobrado o seu uso sujeito à outorga.", "E": "e) a outorga do direito ao seu uso implica sua alienação parcial."}, "gabarito": "B", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 51, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>Não se encontra inserido entre os princípios da Política Nacional de Resíduos Sólidos o princípio:</p>", "opcoes": {"A": "da prevenção e da precaução;", "B": "do poluidor-pagador e do protetor-recebedor;", "C": "da visão sistêmica, na gestão dos resíduos sólidos, que considere as variáveis ambiental, social, cultural, econômica, tecnológica e de saúde pública;", "D": "do desenvolvimento sustentável;", "E": "da adoção da economia de massa, baseado no consumo de bens e serviços, desassociado do estímulo à implantação do desenvolvimento e aprimoramento de tecnologias limpas"}, "gabarito": "E", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 52, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>Resíduo sólido pode ser legalmente definido como:</p>", "opcoes": {"A": "Qualquer material, substância, objeto ou bem descartado resultante de atividades humanas em sociedade, a cuja destinação final se procede, se propõe proceder ou se está obrigado a proceder, nos estados sólido ou semissólido.", "B": "Gases contidos em recipientes e líquidos cujas particularidades tornem viável o seu lançamento na rede pública de esgotos ou em corpos d’água.", "C": "Qualquer material, substância, objeto ou bem descartado resultantes de fenômenos físico-climáticos, surgidos na natureza, sem a interferência humana.", "D": "Apenas o lixo hospitalar e industrial podem ser legalmente considerados como resíduos sólidos.", "E": "Apenas o lixo doméstico e agrícola podem ser legalmente considerados como resíduos sólidos."}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 53, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>A política nacional de resíduos sólidos pode ser definida como:</p>", "opcoes": {"A": "Uma ação pública integrada e coordenada com o sistema de proteção ambiental – a política nacional do meio ambiente – que reúne o conjunto de princípios, objetivos, instrumentos, diretrizes, metas e ações adotados pelo Governo Federal, isoladamente ou em regime de cooperação com Estados, Distrito Federal, Municípios ou particulares, com vistas à gestão integrada e ao gerenciamento ambientalmente adequado dos resíduos sólidos.", "B": "Uma ação pública-privada integrada e coordenada com o sistema de proteção ambiental – a política nacional do meio ambiente – que reúne o conjunto de princípios, objetivos, instrumentos, diretrizes, metas e ações adotados pelo Governo Federal, isoladamente ou em regime de cooperação com Estados, Distrito Federal, Municípios ou particulares, com vistas à gestão integrada e ao gerenciamento ambientalmente adequado dos resíduos sólidos.", "C": "Uma ação privada integrada e coordenada com o sistema de proteção ambiental – a política nacional do meio ambiente – que reúne o conjunto de princípios, objetivos, instrumentos, diretrizes, metas e ações adotados pelo Governo Federal, isoladamente ou em regime de cooperação com Estados, Distrito Federal, Municípios ou particulares, com vistas à gestão integrada e ao gerenciamento ambientalmente adequado dos resíduos sólidos.", "D": "Uma ação pública integrada e coordenada com o sistema de proteção ao consumidor, que reúne o conjunto de princípios, objetivos, instrumentos, diretrizes, metas e ações adotados pelo Governo Federal, isoladamente ou em regime de cooperação com Estados, Distrito Federal, Municípios ou particulares, com vistas à gestão integrada e ao gerenciamento ambientalmente adequado dos resíduos sólidos.", "E": "Uma ação pública integrada e coordenada com o sistema de proteção ao consumidor, que reúne o conjunto de princípios, objetivos, instrumentos, diretrizes, metas e ações adotados exclusivamente pelo Governo Federal, com vistas à gestão integrada e ao gerenciamento ambientalmente adequado dos resíduos sólidos."}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 54, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>A Lei Federal nº 12.305/2010, Política Nacional de Resíduos Sólidos, institui a responsabilidade compartilhada pelo ciclo de vida dos produtos, a ser implementada de forma individualizada e encadeada. Com isso, alguns fabricantes, importadores, distribuidores e comerciantes foram obrigados a estruturar e implementar sistemas de logística reversa, mediante retorno dos produtos e / ou embalagens após o uso pelo consumidor, de forma independente do serviço público de limpeza urbana. De acordo com essa Lei, assinale a alternativa que apresenta produtos que não devem ter sistemas de logística reversa.</p>", "opcoes": {"A": "Pilhas e baterias;", "B": "Lâmpadas incandescentes;", "C": "Pneus;", "D": "Óleos lubrificantes, seus resíduos e embalagens.", "E": "Pilhas e baterias, além de plásticos."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 55, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>A Lei n.º 12.305/2010, que instituiu a Política Nacional de Resíduos Sólidos, estabelece que a destinação final ambientalmente adequada dos resíduos sólidos inclui a reutilização, a reciclagem, a compostagem, a recuperação e o aproveitamento energético ou outras destinações admitidas pelos órgãos competentes do Sistema Nacional do Meio Ambiente (Sisnama), do Sistema Nacional de Vigilância Sanitária (SNVS) e do Sistema Unificado de Atenção à Sanidade Agropecuária (Suasa), entre elas a disposição final, observando normas operacionais específicas, de modo a evitar danos ou riscos à saúde pública e à segurança e a minimizar os impactos ambientais adversos. Considerando a Lei n.º 12.305/2010, assinale a alternativa incorreta.</p>", "opcoes": {"A": "A reciclagem pode ser definida como uma série de atividades que visam a desviar materiais que seriam dispostos como resíduos sólidos e que podem ser utilizados como matéria-prima na manufatura de novos produtos.", "B": "A reciclagem da fração orgânica dos resíduos sólidos pode ser realizada por meio do processo biológico aeróbio de compostagem, que resulta na produção de composto orgânico que pode ser aplicado ao solo.", "C": "A disposição final de resíduos sólidos em lixões é uma alternativa tecnológica adequada, que minimiza impactos ambientais e de saúde pública.", "D": "O tratamento térmico de resíduos sólidos apresenta como vantagens a redução de massa e volume a serem descartados e a possibilidade de recuperação energética.", "E": "A geração do chorume observada ao longo da vida útil de um aterro sanitário está relacionada a fatores climáticos, à composição, à densidade, ao teor de umidade dos resíduos aterrados e à permeabilidade, à idade e à profundidade do aterro."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 56, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>Conforme a Lei n.º 12.305/2010, que institui a Política Nacional de Resíduos Sólidos, entende-se por coleta seletiva o(a):</p>", "opcoes": {"A": "ato de natureza contratual firmado entre o Poder Público e fabricantes, importadores, distribuidores ou comerciantes.", "B": "série de etapas que envolvem o desenvolvimento do produto, a obtenção de matérias-primas e insumos, o processo produtivo, o consumo e a disposição final.", "C": "coleta de resíduos sólidos previamente segregados segundo sua constituição ou composição.", "D": "conjunto de mecanismos e procedimentos que garantam à sociedade informações e participação nos processos de formulação, implementação e avaliação das políticas públicas relacionadas aos resíduos sólidos.", "E": "conjunto de ações exercidas, direta ou indiretamente, nas etapas de coleta, transporte, transbordo, tratamento e destinação final ambientalmente adequada dos resíduos sólidos."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 57, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>O Plano Nacional de Resíduos Sólidos, elaborado pela União (sob a coordenação do Ministério do Meio Ambiente), deve ter vigência por prazo indeterminado e horizonte de 20 (vinte) anos, sendo que a sua atualização deve ser realizada a cada:</p>", "opcoes": {"A": "2 anos.", "B": "4 anos.", "C": "6 anos.", "D": "8 anos.", "E": "10 anos."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 58, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>É um objetivo expresso pela Política Nacional de Resíduos Sólidos:</p>", "opcoes": {"A": "o desenvolvimento sustentável.", "B": "o respeito às diversidades locais e regionais.", "C": "a proteção da saúde pública e da qualidade ambiental.", "D": "a cooperação entre as diferentes esferas do poder público.", "E": "a prevenção e a precaução."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 59, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>De acordo com a Lei n° 12.305/2010, o processo de transformação dos resíduos sólidos que envolve alteração de suas propriedades físicas, físico-químicas ou biológicas, com vistas à transformação em insumos ou novos produtos, observadas as condições e os padrões estabelecidos pelos órgãos competentes, denomina-se:</p>", "opcoes": {"A": "logística reversa.", "B": "reutilização.", "C": "gerenciamento de resíduos sólidos.", "D": "manejo de resíduos sólidos.", "E": "reciclagem."}, "gabarito": "E", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 60, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>Com base nas práticas atuais propostas na legislação sobre resíduos sólidos, os programas de gestão devem priorizar:</p>", "opcoes": {"A": "reutilização.", "B": "tratamento convencional.", "C": "redução.", "D": "não geração.", "E": "reciclagem."}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 61, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>Para evitar a poluição por Resíduos Sólidos, é correto afirmar:</p>", "opcoes": {"A": "cabe ao titular dos serviços públicos de limpeza urbana e de manejo de resíduos sólidos, observado, se houver, o plano municipal de gestão integrada de resíduos sólidos, estabelecer sistema de coleta seletiva.", "B": "sem prejuízo das obrigações estabelecidas no plano de gerenciamento de resíduos sólidos, os fabricantes, importadores, distribuidores e comerciantes não têm responsabilidade na divulgação de informações relativas às formas de evitar, reciclar e eliminar os resíduos sólidos associados a seus respectivos produtos.", "C": "os comerciantes e distribuidores deverão dar destinação final ambientalmente adequada a produtos e embalagens reunidos ou devolvidos pelos consumidores do sistema de logística reversa.", "D": "todos os participantes dos sistemas de logística reversa, sem exceção, manterão atualizadas e disponíveis, ao órgão municipal competente e a outras autoridades, informações completas sobre a realização das ações sob sua responsabilidade.", "E": "os fabricantes, importadores, distribuidores e comerciantes de pilhas e baterias são obrigados a estruturar e implementar sistemas de logística reversa, mediante retorno dos produtos após o uso pelo consumidor, no caso de não haver o serviço público de limpeza urbana e de manejo dos resíduos sólidos."}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 62, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>De acordo com a Lei 12.305/2010, em seu art. 13, são legalmente classificados como resíduos sólidos, quanto à origem, EXCETO:</p>", "opcoes": {"A": "resíduos domiciliares: os originários de atividades domésticas em residências urbanas.", "B": "resíduos de limpeza urbana: os originários da varrição, limpeza de logradouros e vias públicas e outros serviços de limpeza urbana.", "C": "resíduos sólidos urbanos: os englobados nas alíneas “a” e “b”.", "D": "resíduos de mineração: os gerados na atividade de pesquisa, extração ou beneficiamento de minérios;", "E": "resíduos dos serviços públicos notariais: os gerados nessas atividades, excetuados os referidos na alínea “c”;"}, "gabarito": "E", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 63, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>De acordo com a Lei 12.305/2010, as empresas deverão cuidar dos resíduos sólidos que sua atividade produz, adotando um sistema de gerenciamento e gestão. Para tanto, deverão observar, em ordem de prioridade, as seguintes ações. Assinale a alternativa que indica a correta ordem de prioridade definida pela lei em referência:</p>", "opcoes": {"A": "não geração de resíduos, aumento dos resíduos gerados, reutilização dos resíduos gerados, recuperação, tratamento dos resíduos, disposição final ambientalmente adequada.", "B": "não geração de resíduos, redução dos resíduos gerados, reutilização dos resíduos gerados, reciclagem, tratamento dos resíduos, disposição final ambientalmente adequada.", "C": "geração de resíduos, redução dos resíduos gerados, reutilização dos resíduos gerados, reciclagem, tratamento dos resíduos, disposição final ambientalmente adequada.", "D": "não geração de resíduos, não redução dos resíduos gerados, proibição de utilização dos resíduos gerados, reciclagem, tratamento dos resíduos, disposição final ambientalmente adequada.", "E": "geração de resíduos, disposição final ambientalmente adequada, redução dos resíduos gerados, reutilização dos resíduos gerados, reciclagem, tratamento dos resíduos."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 64, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>Qual das alternativas abaixo contém princípio(s) não expressamente previsto(s) na Lei Federal n.º 12.305/2010 como norteador(es) da Política Nacional de Resíduos Sólidos?</p>", "opcoes": {"A": "Prevenção e precaução.", "B": "Desenvolvimento sustentável.", "C": "Inversão do ônus da prova.", "D": "Razoabilidade e proporcionalidade.", "E": "NDA"}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}, {"num": 65, "tema": "Módulo 8 - Política Nacional de Resíduos Sólidos", "enunciado": "<p>A Lei n° 12.305/2010 estabelece que os municípios com menos de 20.000 habitantes podem usar um plano municipal de gestão integrada de resíduos sólidos com conteúdo simplificado desde que:</p>", "opcoes": {"A": "estejam localizados em Unidade de Conservação.", "B": "não sejam integrantes de áreas de especial interesse turístico.", "C": "estejam inseridos em área de influência de mineradoras.", "D": "o órgão responsável pelo licenciamento ambiental do município assim o aprove.", "E": "não estejam inseridos no plano de saneamento básico."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Política Nacional de Resíduos Sólidos (PNRS)</strong> impõe a responsabilidade compartilhada e institui a Logística Reversa de forma obrigatória para certos setores.</p>", "fundamentacao": "<p>Lei 12.305/2010. Foco na não geração, redução e reciclagem de resíduos sólidos.</p>", "dica": "<p><strong>Atenção!</strong> Produtos como pneus, pilhas, agrotóxicos e óleos lubrificantes sofrem Logística Reversa obrigatória e independente do sistema municipal de lixo!</p>"}];
const RESUMOS = [{"title": "Sistema Nacional de Unidades de Conservação (SNUC)", "body": "\n<p>O SNUC, instituído pela Lei 9.985/2000, estabelece o ordenamento dos espaços territoriais especialmente protegidos pelo Poder Público, com o objetivo de conservar a biodiversidade.</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>Dois Grandes Grupos:</strong> As UCs dividem-se em Unidades de Proteção Integral (onde a regra é a preservação da natureza, admitindo-se apenas uso indireto dos recursos naturais, salvo exceções legais) e Unidades de Uso Sustentável (onde o objetivo é compatibilizar a conservação da natureza com o uso direto de parcela dos recursos).</li>\n<li>  <strong>Compensação Ambiental:</strong> Instrumento financeiro que obriga o empreendedor a apoiar a implementação e manutenção de UCs de proteção integral. Ocorre nos casos de licenciamento de empreendimentos de significativo impacto ambiental (baseado em EIA-RIMA).</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Art. 225, §1º, III, da CF/88:</strong> Incumbe ao Poder Público definir os espaços territoriais especialmente protegidos.</li>\n<li>  <strong>Art. 36 da Lei 9.985/00 e Decreto 6.848/09:</strong> Regram a compensação ambiental.</li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote><strong>Piso Inconstitucional:</strong> O STF declarou que a compensação ambiental é constitucional, mas o piso fixo de 0,5% dos custos totais do empreendimento para essa compensação é inconstitucional (ADI 3378). O valor deve ser fixado proporcionalmente ao impacto ambiental medido!</blockquote>\n\n<p>---</p>"}, {"title": "Responsabilidade Civil Ambiental", "body": "\n<p>A responsabilidade civil busca a reparação do dano ao meio ambiente. A Constituição Federal, em seu art. 225, §3º, instituiu a chamada Tríplice Responsabilidade (Civil, Administrativa e Penal) que são independentes e autônomas (não há \"bis in idem\").</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>Responsabilidade Objetiva:</strong> Não se exige a comprovação de culpa ou dolo. Basta a comprovação da conduta, do dano e do nexo de causalidade.</li>\n<li>  <strong>Teoria do Risco Integral:</strong> No direito ambiental, adota-se a Teoria do Risco Integral. Isso significa que <strong>NÃO</strong> se admite as excludentes de responsabilidade clássicas (força maior, caso fortuito, fato de terceiro ou culpa exclusiva da vítima).</li>\n<li>  <strong>Poluidor Indireto:</strong> É poluidor tanto a pessoa (física ou jurídica, pública ou privada) que causa o dano de forma direta quanto quem o causa de forma indireta (quem financia, permite ou lucra com o dano).</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Art. 14, §1º da Lei 6.938/81:</strong> Prevê expressamente a responsabilidade objetiva pelos danos causados ao meio ambiente, fundamentada no princípio do poluidor-pagador.</li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote><strong>Cuidado com a Excludente!</strong> Na prova, a banca vai tentar convencer você de que um raio, um desastre natural ou a culpa de um terceiro exime a empresa de pagar a indenização ambiental. Lembre-se: pelo <strong>Risco Integral</strong>, a empresa repara o dano em qualquer circunstância!</blockquote>\n\n<p>---</p>"}, {"title": "Responsabilidade Administrativa Ambiental", "body": "\n<p>Trata-se das sanções aplicadas diretamente pela Administração Pública (órgãos do SISNAMA, como IBAMA, ICMBio e órgãos estaduais/municipais) contra quem infringe regras ambientais.</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>Natureza Subjetiva:</strong> O STJ firmou o entendimento de que a responsabilidade administrativa é de natureza <strong>subjetiva</strong>, sendo necessária a comprovação de dolo ou culpa do infrator, além da demonstração do nexo causal.</li>\n<li>  <strong>Poder de Polícia:</strong> As sanções vão desde multas simples e diárias até suspensão de atividades, apreensão de maquinários, destruição de produtos e perda de incentivos fiscais.</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Art. 70 e seguintes da Lei 9.605/98 (Lei de Crimes e Infrações Ambientais).</strong></li>\n<li>  <strong>Decreto 6.514/08:</strong> Regulamenta as infrações e sanções administrativas ao meio ambiente.</li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote>Apegue-se à diferença: A Responsabilidade <strong>Civil</strong> é Objetiva (Risco Integral). A Responsabilidade <strong>Administrativa</strong> (as multas do Ibama) é Subjetiva (exige culpa/dolo)!</blockquote>\n\n<p>---</p>"}, {"title": "Responsabilidade Penal Ambiental", "body": "\n<p>A responsabilização penal na esfera ambiental é um dos mecanismos mais rígidos do sistema brasileiro, regulado massivamente pela Lei de Crimes Ambientais (Lei 9.605/98).</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>Pessoas Jurídicas Podem Cometer Crimes:</strong> Uma grande inovação do sistema brasileiro é a aceitação de que Pessoas Jurídicas sofram sanções penais (multas, restrição de direitos, suspensão de atividades, liquidação forçada), desde que a infração seja cometida por decisão de seu representante ou órgão colegiado no interesse ou benefício da empresa.</li>\n<li>  <strong>Dupla Imputação Não Obrigatória:</strong> O STF entende que é perfeitamente possível processar penalmente a Pessoa Jurídica sozinha, sem precisar denunciar obrigatoriamente a pessoa física junto.</li>\n<li>  <strong>Princípio da Insignificância:</strong> É amplamente inaplicável em crimes ambientais pelo STJ/STF (com pouquíssimas e raríssimas exceções), pois o bem jurídico tutelado (meio ambiente) é macrobem e de interesse de toda a sociedade.</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Art. 225, §3º, CF e Art. 3º da Lei 9.605/98.</strong></li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote>Fique alerta nas questões sobre a responsabilização da Pessoa Jurídica. A teoria da \"Dupla Imputação\" (que exigia que o CNPJ só fosse processado se o CPF do diretor também fosse) <strong>caiu por terra no STF</strong>!</blockquote>\n\n<p>---</p>"}, {"title": "Política Nacional de Resíduos Sólidos (PNRS)", "body": "\n<p>Instituída para frear o acúmulo de lixo e otimizar os recursos através da reciclagem e da logística reversa, com forte apelo em provas.</p>\n\n<h3>📚 Síntese Estratégica</h3>\n<ul>\n<li>  <strong>Logística Reversa:</strong> Instrumento que obriga o retorno dos produtos ou embalagens (pós-consumo) ao setor empresarial, independentemente do serviço público de limpeza urbana.</li>\n<li>  <strong>Resíduo vs Rejeito:</strong> Resíduo é aquilo que ainda possui valor e pode ser reaproveitado ou reciclado. Rejeito é o resíduo sólido que, esgotadas as possibilidades de tratamento/recuperação tecnológicas e econômicas viáveis, não apresenta outra possibilidade que não seja a disposição final ambientalmente adequada (ex: aterro sanitário).</li>\n<li>  <strong>Responsabilidade Compartilhada:</strong> Fabricantes, importadores, distribuidores, comerciantes e consumidores são solidariamente e concatenadamente responsáveis pelo ciclo de vida dos produtos.</li>\n</ul>\n\n<h3>⚖️ Fundamentação Jurídica</h3>\n<ul>\n<li>  <strong>Lei 12.305/10:</strong> Princípios fundamentais incluem o poluidor-pagador, a prevenção, a precaução, o desenvolvimento sustentável e o reconhecimento do resíduo sólido reutilizável/reciclável como um bem econômico e de valor social.</li>\n</ul>\n\n<h3>🚨 Atenção (Dica de Prova)</h3>\n<blockquote>Existem produtos específicos nos quais a implementação da logística reversa é OBRIGATÓRIA por lei, como <strong>agrotóxicos e suas embalagens, pilhas e baterias, pneus, óleos lubrificantes, lâmpadas fluorescentes e eletroeletrônicos</strong>. Lixo hospitalar exige tratamento, mas não se enquadra tradicionalmente como logística reversa de consumo.</blockquote>"}];
let questions = [...ALL_QUESTIONS];
let currentIdx = 0;
let score = 0;
let answered = {};
let timerInterval = null;
let timerValue = 45;

function openModal() {
  const m = document.getElementById('resumo-modal');
  const b = document.getElementById('modal-body');
  if (b.children.length === 0) {
      RESUMOS.forEach((r, idx) => {
        const btn = document.createElement('button');
        btn.className = 'resumo-btn';
        btn.innerHTML = `📖 ${r.title}`;
        
        const txt = document.createElement('div');
        txt.className = 'resumo-text';
        txt.id = `resumo-txt-${idx}`;
        txt.innerHTML = r.body;
        
        btn.onclick = () => {
          const isActive = txt.classList.contains('active');
          document.querySelectorAll('.resumo-text').forEach(el => el.classList.remove('active'));
          if (!isActive) txt.classList.add('active');
        };
        
        b.appendChild(btn);
        b.appendChild(txt);
      });
  }
  m.style.display = 'flex';
}

function closeModal(e) {
  if(e) e.preventDefault();
  document.getElementById('resumo-modal').style.display = 'none';
}

function buildCarousel() {
  const c = document.getElementById('carousel');
  c.innerHTML = '';

  const intro = document.createElement('div');
  intro.className = 'slide';
  intro.innerHTML = `
    <div class="intro-card">
      <h1>Simulado · Direito Ambiental</h1>
      <p>Material otimizado para celulares! Arraste ou clique em "Avançar" para começar. Clique em "Resumos" no menu superior para ler as sínteses separadas. <strong>Contém ${questions.length} questões alinhadas com os conteúdos das aulas.</strong></p>
    </div>`;
  c.appendChild(intro);

  questions.forEach((q, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = buildQuestionSlide(q, i);
    c.appendChild(slide);
  });

  const result = document.createElement('div');
  result.className = 'slide';
  result.id = 'result-slide';
  result.innerHTML = `
    <div class="result-card">
      <div class="result-score" id="final-score">0</div>
      <div class="result-label">acertos de <strong>${questions.length}</strong> questões</div>
      <div class="result-pct" id="final-pct">0%</div>
      <button class="btn-restart" onclick="location.reload()">🔄 Reiniciar Simulado</button>
    </div>`;
  c.appendChild(result);
  updateCounter();
}

function buildQuestionSlide(q, i) {
  const optsHtml = Object.entries(q.opcoes).map(([k,v]) => `
    <div class="opt" id="opt-${i}-${k}" onclick="selectOpt(${i}, '${k}')">
      <span class="opt-letter">${k}</span>
      <span>${v}</span>
    </div>`).join('');

  return `
    <div class="q-card" id="qcard-${i}">
      <div class="q-inner" id="qinner-${i}">
        <div class="q-face q-front">
          <div class="q-meta">
            <span class="q-num">Q${i+1} / ${questions.length}</span>
            <span class="q-tema">${q.tema}</span>
          </div>
          <div class="timer-bar-wrap"><div class="timer-bar" id="tbar-${i}"></div></div>
          <div class="timer-count" id="tcount-${i}">45s</div>
          <div class="q-enunc">${q.enunciado}</div>
          <div class="options">${optsHtml}</div>
          <div class="flip-hint">Toque na resposta correta para virar o card</div>
        </div>
        <div class="q-face q-back" onclick="unflip(${i})">
          <span class="gab-badge">✅ Gabarito: ${q.gabarito})</span>
          <div class="back-section">
            <div class="back-section-title">📚 Síntese Teórica</div>
            ${q.sintese}
          </div>
          <div class="back-section legal">
            <div class="back-section-title">⚖️ Fundamentação Jurídica</div>
            ${q.fundamentacao}
          </div>
          <div class="back-section dica">
            <div class="back-section-title">🚨 Dica de Prova</div>
            ${q.dica}
          </div>
          <div class="flip-hint">Toque para voltar para a pergunta</div>
        </div>
      </div>
    </div>`;
}

function selectOpt(i, letter) {
  if (answered[i] !== undefined) return;
  answered[i] = letter;
  const q = questions[i];
  const isCorrect = letter === q.gabarito;
  if (isCorrect) score++;
  document.getElementById('score').textContent = `Acertos: ${score}`;

  ['A','B','C','D','E'].forEach(k => {
    const el = document.getElementById(`opt-${i}-${k}`);
    if (!el) return;
    if (k === q.gabarito) el.classList.add('correct');
    else if (k === letter && !isCorrect) el.classList.add('wrong');
  });

  stopTimer();
  setTimeout(() => flipCard(i), 850);
}

function flipCard(i) {
  document.getElementById(`qinner-${i}`).classList.add('flipped');
}
function unflip(i) {
  document.getElementById(`qinner-${i}`).classList.remove('flipped');
}

let currentTimerIdx = -1;
function startTimer(i) {
  stopTimer();
  timerValue = 45;
  currentTimerIdx = i;
  const bar = document.getElementById(`tbar-${i}`);
  const cnt = document.getElementById(`tcount-${i}`);
  if (!bar || !cnt) return;
  bar.style.width = '100%';
  bar.style.background = 'var(--accent)';
  timerInterval = setInterval(() => {
    timerValue--;
    const pct = (timerValue / 45) * 100;
    bar.style.width = pct + '%';
    cnt.textContent = timerValue + 's';
    if (timerValue <= 10) { bar.style.background = '#ef4444'; cnt.style.color = '#ef4444'; }
    if (timerValue <= 0) {
      stopTimer();
      if (answered[i] === undefined) flipCard(i);
    }
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function goTo(idx) {
  const total = questions.length + 2;
  currentIdx = Math.max(0, Math.min(idx, total - 1));
  const c = document.getElementById('carousel');
  c.style.transform = `translateX(-${currentIdx * 100}%)`;
  stopTimer();
  if (currentIdx > 0 && currentIdx <= questions.length) {
    const qIdx = currentIdx - 1;
    if (answered[qIdx] === undefined) startTimer(qIdx);
  }
  if (currentIdx === questions.length + 1) {
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-pct').textContent = Math.round((score / questions.length) * 100) + '%';
  }
  updateCounter();
}

function navigate(dir) { goTo(currentIdx + dir); }

function updateCounter() {
  const total = questions.length;
  let label;
  if (currentIdx === 0) label = `Início`;
  else if (currentIdx > total) label = `Fim`;
  else label = `${currentIdx} / ${total}`;
  document.getElementById('counter').textContent = label;
}

buildCarousel();
goTo(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direito Ambiental · NP2</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --primary: #064e3b;
  --accent: #059669;
  --accent-soft: rgba(5,150,105,0.08);
  --text: #334155;
  --text-dim: #64748b;
  --border: #e2e8f0;
  --shadow: 0 10px 25px -5px rgba(0,0,0,0.06);
  --blue: #1d4ed8;
  --blue-bg: #eff6ff;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --rose: #be123c;
  --rose-bg: #fff1f2;
  --green: #059669;
  --green-bg: rgba(5,150,105,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; font-family:'Inter', sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

/* Formatação do conteúdo em HTML gerado pelo Markdown */
p { margin-bottom: 12px; line-height: 1.6; font-size: 14px; }
p:last-child { margin-bottom: 0; }
h2 { font-size: 18px; color: var(--primary); margin: 24px 0 12px 0; }
h3 { font-size: 15px; color: var(--blue); margin: 20px 0 10px 0; display:flex; align-items:center; gap:6px; }
ul { padding-left: 20px; margin-bottom: 16px; }
li { margin-bottom: 8px; line-height: 1.5; font-size: 14px; }
strong { font-weight: 700; color: #1e293b; }
blockquote { background: var(--amber-bg); border-left: 4px solid var(--amber); padding: 12px 16px; margin: 16px 0; border-radius: 0 8px 8px 0; font-style: italic; color: #78350f; }
hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }

.bg { position:fixed; inset:0; z-index:0;
  background: radial-gradient(at 0% 0%, rgba(5,150,105,0.04) 0, transparent 50%),
              radial-gradient(at 100% 100%, rgba(6,78,59,0.04) 0, transparent 50%); }

/* HEADER */
.hd { position:fixed; top:0; left:0; right:0; z-index:200; height:64px;
  background:rgba(255,255,255,0.88); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; backdrop-filter:blur(12px); }
.hd-left { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.hd-logo { background:var(--primary); color:#fff; font-weight:700; font-size:12px;
  padding:4px 8px; border-radius:6px; letter-spacing:.5px; }
.hd-title { font-size:13px; font-weight:700; color:var(--primary); text-transform:uppercase; }
.hd-right { display:flex; align-items:center; gap:8px; }

.btn-resumo { padding:6px 14px; border-radius:4px; border:none;
  font-size:12px; font-weight:700; cursor:pointer; background:var(--primary);
  color:#fff; transition:all .2s; }
.btn-resumo:hover { background:#047857; }

.counter-pill { font-size:12px; font-weight:700; color:var(--primary);
  background:var(--accent-soft); padding:4px 12px; border-radius:20px; }

/* MAIN */
.main { position:fixed; inset:0; top:64px; bottom:72px; overflow:hidden; z-index:1; }

/* CAROUSEL */
.carousel { display:flex; height:100%; transition:transform .45s cubic-bezier(.4,0,.2,1); }
.slide { min-width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:15px; }

/* INTRO SLIDE */
.intro-card { background:var(--card); border-radius:24px; padding:30px;
  box-shadow:var(--shadow); max-width:700px; width:100%; max-height:85vh; overflow-y:auto; }
.intro-card h1 { font-family:'Cormorant Garamond',serif; font-size:clamp(22px,4vw,34px);
  color:var(--primary); margin-bottom:8px; }
.intro-card p { color:var(--text-dim); font-size:14px; margin-bottom:24px; }

/* QUESTION CARD */
.q-card { perspective:1200px; max-width:680px; width:100%; height:min(620px, calc(100vh - 150px)); cursor:pointer; }
.q-inner { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.4,0,.2,1); }
.q-inner.flipped { transform:rotateY(180deg); }
.q-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:24px;
  box-shadow:var(--shadow); overflow-y:auto; overflow-x:hidden; background:var(--card); }

.q-front { padding:24px; display:flex; flex-direction:column; gap:12px; }
.q-back { padding:24px; transform:rotateY(180deg); display:flex; flex-direction:column; gap:16px; }

/* Front elements */
.q-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex-shrink:0; }
.q-num { font-size:12px; font-weight:600; color:var(--primary); background:var(--accent-soft);
  padding:3px 10px; border-radius:10px; }
.q-tema { font-size:11px; color:var(--text-dim); font-weight:500; }
.timer-bar-wrap { height:4px; background:#f1f5f9; border-radius:2px; overflow:hidden; flex-shrink:0; margin-top:4px; }
.timer-bar { height:100%; background:var(--accent); border-radius:2px; transition:width 1s linear, background .3s; }
.timer-count { font-size:11px; font-weight:700; color:var(--text-dim); text-align:right; flex-shrink:0; margin-bottom:4px; }
.q-enunc { margin-bottom:12px; } /* Deixando as formatações baseadas na tag p */
.q-enunc p { color:var(--primary); font-size:clamp(13.5px,2.5vw,15px); font-weight:500; }

.options { display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:12px;
  border:1.5px solid var(--border); cursor:pointer; transition:all .2s; font-size:13px; line-height:1.4; }
.opt:hover { border-color:var(--accent); background:var(--accent-soft); }
.opt.selected { border-color:var(--accent); background:var(--accent-soft); }
.opt.correct { border-color:var(--green); background:var(--green-bg); color:#065f46; font-weight:600; }
.opt.wrong { border-color:var(--rose); background:var(--rose-bg); }
.opt-letter { font-weight:800; color:var(--accent); min-width:18px; font-size:14px; margin-top:1px; }

/* Back elements */
.gab-badge { display:inline-flex; align-items:center; gap:8px; background:#d1fae5;
  color:#065f46; font-weight:700; font-size:14px; padding:10px 18px; border-radius:12px; flex-shrink:0; }
.back-section { background:var(--blue-bg); border-left:4px solid var(--blue);
  padding:16px 20px; border-radius:0 8px 8px 0; }
.back-section.legal { background:var(--amber-bg); border-color:var(--amber); }
.back-section.dica { background:var(--rose-bg); border-color:var(--rose); }
.back-section-title { font-size:11px; font-weight:800; text-transform:uppercase;
  letter-spacing:.5px; color:var(--blue); margin-bottom:8px; }
.back-section.legal .back-section-title { color:var(--amber); }
.back-section.dica .back-section-title { color:var(--rose); }

.flip-hint { font-size:11px; color:var(--text-dim); text-align:center; margin-top:auto; padding-top:10px; }

/* FOOTER NAV */
.ft { position:fixed; bottom:0; left:0; right:0; z-index:200; height:72px;
  background:rgba(255,255,255,0.95); border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; backdrop-filter:blur(12px); gap:12px; }
.nav-btn { padding:12px 24px; border-radius:4px; border:none; font-size:14px;
  font-weight:700; cursor:pointer; transition:all .2s; flex:1; max-width:160px; }
.btn-prev { background:var(--primary); color:#fff; opacity:0.9; }
.btn-prev:hover { background:#047857; opacity:1; }
.btn-next { background:var(--primary); color:#fff; }
.btn-next:hover { background:#047857; }
.score-pill { font-size:13px; font-weight:800; color:var(--primary);
  background:var(--accent-soft); padding:8px 16px; border-radius:20px; white-space:nowrap; text-align:center; }

/* RESULT SLIDE */
.result-card { background:var(--card); border-radius:24px; padding:48px 36px;
  text-align:center; max-width:500px; width:100%; box-shadow:var(--shadow); }
.result-score { font-size:64px; font-weight:800; color:var(--primary); line-height:1; }
.result-label { font-size:16px; color:var(--text-dim); margin-top:8px; margin-bottom:24px; }
.result-pct { font-size:22px; font-weight:700; color:var(--accent); margin-bottom:32px; }
.btn-restart { padding:14px 36px; background:var(--primary); color:#fff; border:none;
  border-radius:4px; font-size:15px; font-weight:700; cursor:pointer; transition:.2s; }

/* MODAL RESUMO */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; display:none; justify-content:center; align-items:center; backdrop-filter:blur(4px); }
.modal-content { background:#fff; width:95%; max-width:700px; max-height:85vh; border-radius:20px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); }
.modal-header { padding:18px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--blue-bg); }
.modal-header h2 { font-size:18px; color:var(--blue); margin:0; }
.btn-close { background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-dim); }
.modal-body { padding:0; overflow-y:auto; flex:1; display:flex; flex-direction:column; }
.resumo-btn { padding:18px 24px; text-align:left; border:none; border-bottom:1px solid var(--border); background:#fff; font-size:15px; font-weight:700; color:var(--primary); cursor:pointer; transition:.2s; }
.resumo-btn:hover { background:var(--bg); }
.resumo-text { padding:24px; display:none; background:#fff; border-bottom:1px solid var(--border); }
.resumo-text.active { display:block; }

/* Ajustes Mobile Finos (iPhone) */
@media (max-width: 600px) {
  .hd { padding:0 12px; } 
  .ft { padding:0 12px; }
  .q-front, .q-back { padding:20px 16px; }
  .intro-card { padding:24px 18px; }
  
  .hd-title { font-size: 11px; } 
  .hd-right { gap: 4px; }
  .btn-resumo { padding: 5px 8px; font-size: 11px; }
  .nav-btn { padding: 10px 14px; font-size: 13px; }
  p { font-size:13px; }
  li { font-size:13px; }
}
</style>
</head>
<body>
<div class="bg"></div>

<header class="hd">
  <div class="hd-left">
    <span class="hd-logo">NP2</span>
    <span class="hd-title">AMBIENTAL</span>
  </div>
  <div class="hd-right">
    <button class="btn-resumo" onclick="openModal()">📚 Resumos</button>
    <span class="counter-pill" id="counter">1 / 65</span>
  </div>
</header>

<!-- Modal de Resumos -->
<div class="modal-overlay" id="resumo-modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>📚 Resumo de Véspera</h2>
      <button class="btn-close" onclick="closeModal(event)">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- Injetado via JS -->
    </div>
  </div>
</div>

<main class="main">
  <div class="carousel" id="carousel"></div>
</main>

<footer class="ft">
  <button class="nav-btn btn-prev" onclick="navigate(-1)">← Voltar</button>
  <span class="score-pill" id="score">Acertos: 0</span>
  <button class="nav-btn btn-next" onclick="navigate(1)">Avançar →</button>
</footer>

<script>
const ALL_QUESTIONS = [{"num": 1, "tema": "Módulo 4 - SNUC e Unidades de Conservação", "enunciado": "<p>(OAB/CESPE UNIF. 2007.2) Com relação à responsabilidade por danos ambientais, assinale a opção correta.</p>", "opcoes": {"A": "A responsabilidade civil por danos causados ao meio ambiente, por ser de natureza objetiva, exige a caracterização de culpa para efeito de obrigação de reparar os prejuízos causados.", "B": "Em razão da necessidade de melhor proteção ao meio ambiente, é objetiva a natureza das responsabilidades penal e administrativa por danos causados a esse bem jurídico.", "C": "A responsabilidade civil em matéria ambiental é de caráter objetivo, prescindindo-se, para sua caracterização, do elemento culpa e do nexo causal entre a conduta e o evento danoso.", "D": "A natureza objetiva da responsabilidade civil por danos ambientais inspira-se em um postulado de eqüidade, pois aquele que obtém lucros com uma atividade deve responder por eventuais prejuízos dela resultantes, independentemente de culpa, sendo igualmente irrelevante saber se a atividade danosa é lícita ou ilícita.", "E": "NDA"}, "gabarito": "D", "core": true, "sintese": "<p>As Unidades de Conservação (SNUC) são espaços territoriais especialmente protegidos, criados por lei. Existem as de <strong>Uso Sustentável</strong> e de <strong>Proteção Integral</strong>.</p>", "fundamentacao": "<p>Lei 9.985/2000 (SNUC) e art. 225, §1º, III, da Constituição Federal.</p>", "dica": "<p><strong>Atenção!</strong> A Compensação Ambiental exige a destinação de um valor ao apoio das UCs, porém o STF proibiu a fixação de um piso rígido mínimo de 0,5% (ADI 3378)!</p>"}, {"num": 2, "tema": "Módulo 4 - SNUC e Unidades de Conservação", "enunciado": "<p>(CESPE - 2012 - MPE-PI - Promotor de Justiça – com adaptações) Sabendo que, no Brasil, a responsabilidade por danos provocados ao meio ambiente recebe tratamento constitucional, assinale a opção correta.</p>", "opcoes": {"A": "Com vistas à celeridade processual e à viabilidade da reparação, são vedados, nos processos de reparação por danos ambientais, a denunciação à lide ou o chamamento ao processo, havendo orientação de que seja ajuizada ação própria contra os codevedores ou responsáveis subsidiários.", "B": "A poluição, em qualquer de suas formas, encontra-se criminalizada na Lei de Crimes Ambientais, que prevê penas de reclusão e multa, seja o crime doloso ou culposo, ao agente que o tiver praticado", "C": "Uma empresa devidamente licenciada com outorga para lançar efluentes tratados em curso de água está isenta de responder civilmente caso seja constatado, em exame laboratorial, que a água contenha padrão de qualidade inferior ao desejado.", "D": "Em caso de cometimento de infrações administrativas, as sanções cabíveis não abrangem a aplicação de penas restritivas em relação aos direitos do infrator.", "E": "NDA"}, "gabarito": "A", "core": true, "sintese": "<p>As Unidades de Conservação (SNUC) são espaços territoriais especialmente protegidos, criados por lei. Existem as de <strong>Uso Sustentável</strong> e de <strong>Proteção Integral</strong>.</p>", "fundamentacao": "<p>Lei 9.985/2000 (SNUC) e art. 225, §1º, III, da Constituição Federal.</p>", "dica": "<p><strong>Atenção!</strong> A Compensação Ambiental exige a destinação de um valor ao apoio das UCs, porém o STF proibiu a fixação de um piso rígido mínimo de 0,5% (ADI 3378)!</p>"}, {"num": 3, "tema": "Módulo 4 - SNUC e Unidades de Conservação", "enunciado": "<p>(OAB/FGV - V Unificado 2011.2) A Lei 9.605/98, regulamentada pelo Decreto 6.514/2008, que dispõe sobre sanções  penais  e  administrativas  derivadas  de condutas  e  atividades  lesivas  ao  meio  ambiente,  trouxe novidades nas normas ambientais. Entre elas está a</p>", "opcoes": {"A": "desconsideração  da  pessoa  jurídica,  que  foi estabelecida  para  responsabilizar  a  pessoa  física sempre  que  sua  personalidade  for  obstáculo  ao ressarcimento  de  prejuízos  causados  à  qualidade  do meio ambiente.", "B": "possibilidade  de  assinatura  de  termos  de  ajustamento de conduta, que somente é possível pelo cometimento de ilícito ambiental.", "C": "responsabilidade penal objetiva pelo cometimento de crimes ambientais.", "D": "substituição  da  pena  privativa  de  liberdade  pela restritiva de direito quando tratar-se de crime doloso.", "E": "NDA"}, "gabarito": "A", "core": true, "sintese": "<p>As Unidades de Conservação (SNUC) são espaços territoriais especialmente protegidos, criados por lei. Existem as de <strong>Uso Sustentável</strong> e de <strong>Proteção Integral</strong>.</p>", "fundamentacao": "<p>Lei 9.985/2000 (SNUC) e art. 225, §1º, III, da Constituição Federal.</p>", "dica": "<p><strong>Atenção!</strong> A Compensação Ambiental exige a destinação de um valor ao apoio das UCs, porém o STF proibiu a fixação de um piso rígido mínimo de 0,5% (ADI 3378)!</p>"}, {"num": 4, "tema": "Módulo 4 - SNUC e Unidades de Conservação", "enunciado": "<p>(OAB/CESPE UNIF. 2007.2) Assinale a opção correta no que se refere à tutela ambiental penal do meio ambiente.</p>", "opcoes": {"A": "Em razão da prática de crime ambiental, são aplicáveis às pessoas jurídicas, de forma isolada ou cumulativa, penas de multa, suspensão total ou parcial de atividades, interdição temporária, proibição de recebimento de subvenções ou subsídios, prestação de serviços à comunidade, independentemente da obrigação de reparar os prejuízos causados.", "B": "Nos crimes ambientais, a aplicação de pena de multa decorrente de sentença transitada em julgado impede a cominação de multa por infração administrativa relativamente ao mesmo fato, em razão do princípio do non bis in idem.", "C": "Admite-se, na legislação brasileira, em caráter excepcional, a responsabilidade penal objetiva da pessoa jurídica por crime ambiental, exigindo-se, para sua caracterização, a culpabilidade social da empresa.", "D": "Na hipótese de o diretor de uma empresa determinar a seus empregados que utilizem veículos e instrumentos a ela pertencentes, em horário normal de expediente, para extraírem e transportarem madeira de lei, sem autorização do órgão ambiental competente, destinada a construção particular daquele dirigente, fica caracterizada a responsabilidade penal da pessoa jurídica e da pessoa física.", "E": "NDA"}, "gabarito": "A", "core": true, "sintese": "<p>As Unidades de Conservação (SNUC) são espaços territoriais especialmente protegidos, criados por lei. Existem as de <strong>Uso Sustentável</strong> e de <strong>Proteção Integral</strong>.</p>", "fundamentacao": "<p>Lei 9.985/2000 (SNUC) e art. 225, §1º, III, da Constituição Federal.</p>", "dica": "<p><strong>Atenção!</strong> A Compensação Ambiental exige a destinação de um valor ao apoio das UCs, porém o STF proibiu a fixação de um piso rígido mínimo de 0,5% (ADI 3378)!</p>"}, {"num": 5, "tema": "Módulo 4 - SNUC e Unidades de Conservação", "enunciado": "<p>Em relação à responsabilidade pela reparação do dano ambiental é correto afirmar que: (TRF 2.ª Região – 2014 – Juiz Federal)</p>", "opcoes": {"A": "Tem caráter objetivo, justificado pela doutrina à luz da incidência do princípio da precaução, e não admite regresso.", "B": "É objetiva quando o dano é genuíno e puramente ecológico, ao que se chama de princípio do poluidor pagador.", "C": "É objetiva para o poluidor que causar danos ao meio ambiente e também em relação aos danos a terceiros afetados por sua atividade, ainda que já recuperado o ambiente atingido.", "D": "Passou a ser objetiva com a aprovação da Constituição de 1988 e a adoção, no bojo da Lei Maior, de capítulo dedicado ao meio ambiente.", "E": "É objetiva, integral, solidária, com nexo diluído (ou mesmo apagado) e sem excludente, em razão do princípio da responsabilidade comum e indiferenciada."}, "gabarito": "C", "core": true, "sintese": "<p>As Unidades de Conservação (SNUC) são espaços territoriais especialmente protegidos, criados por lei. Existem as de <strong>Uso Sustentável</strong> e de <strong>Proteção Integral</strong>.</p>", "fundamentacao": "<p>Lei 9.985/2000 (SNUC) e art. 225, §1º, III, da Constituição Federal.</p>", "dica": "<p><strong>Atenção!</strong> A Compensação Ambiental exige a destinação de um valor ao apoio das UCs, porém o STF proibiu a fixação de um piso rígido mínimo de 0,5% (ADI 3378)!</p>"}, {"num": 6, "tema": "Módulo 4 - SNUC e Unidades de Conservação", "enunciado": "<p>Na Festa da Farra do Boi, realizada em Santa Catarina, tradicionalmente, populares se divertem com o fato de submeter animais bovinos a sofrimentos físicos de naturezas diversas. O STF, ao julgar a polêmica que envolve essa festividade, manifestou-se, por maioria, pela proibição de sua realização. A respeito desse assunto, assinale a opção correta. (CESPE/UnB – PGE/PI – Aplicação: 2014)</p>", "opcoes": {"A": "A apreciação do tema em tela envolve a análise de dois bens constitucionalmente protegidos e contidos no conceito de meio ambiente: as manifestações culturais e a fauna nacional.", "B": "A caracterização da Festa da Farra do Boi como manifestação cultural não tem relevância na análise do referido tema, uma vez que, havendo conflito entre normas de proteção ao meio ambiente e normas de proteção ao patrimônio cultural, prevalecem as primeiras.", "C": "A crueldade contra animais é um conceito subjetivo, de sorte que só se considera cruel a prática que submeta o animal a dor extrema.", "D": "A proibição de realização da referida festividade encontra respaldo no princípio constitucional da função ecológica da propriedade.", "E": "A CF, ao proibir práticas que submetam animais a crueldade, contraria a visão antropocêntrica do direito ambiental e passa a considerar os animais, ao lado dos seres humanos, como titulares de direitos."}, "gabarito": "A", "core": true, "sintese": "<p>As Unidades de Conservação (SNUC) são espaços territoriais especialmente protegidos, criados por lei. Existem as de <strong>Uso Sustentável</strong> e de <strong>Proteção Integral</strong>.</p>", "fundamentacao": "<p>Lei 9.985/2000 (SNUC) e art. 225, §1º, III, da Constituição Federal.</p>", "dica": "<p><strong>Atenção!</strong> A Compensação Ambiental exige a destinação de um valor ao apoio das UCs, porém o STF proibiu a fixação de um piso rígido mínimo de 0,5% (ADI 3378)!</p>"}, {"num": 7, "tema": "Módulo 4 - SNUC e Unidades de Conservação", "enunciado": "<p>(OAB/CESPE UNIF. 2007.2) Assinale a opção correta no que se refere à tutela ambiental penal do meio ambiente.</p>", "opcoes": {"A": "Em razão da prática de crime ambiental, são aplicáveis às pessoas jurídicas, de forma isolada ou cumulativa, penas de multa, suspensão total ou parcial de atividades, interdição temporária, proibição de recebimento de subvenções ou subsídios, prestação de serviços à comunidade, independentemente da obrigação de reparar os prejuízos causados.", "B": "Nos crimes ambientais, a aplicação de pena de multa decorrente de sentença transitada em julgado impede a cominação de multa por infração administrativa relativamente ao mesmo fato, em razão do princípio do non bis in idem.", "C": "Admite-se, na legislação brasileira, em caráter excepcional, a responsabilidade penal objetiva da pessoa jurídica por crime ambiental, exigindo-se, para sua caracterização, a culpabilidade social da empresa.", "D": "Na hipótese de o diretor de uma empresa determinar a seus empregados que utilizem veículos e instrumentos a ela pertencentes, em horário normal de expediente, para extraírem e transportarem madeira de lei, sem autorização do órgão ambiental competente, destinada a construção particular daquele dirigente, fica caracterizada a responsabilidade penal da pessoa jurídica e da pessoa física.", "E": "NDA"}, "gabarito": "A", "core": true, "sintese": "<p>As Unidades de Conservação (SNUC) são espaços territoriais especialmente protegidos, criados por lei. Existem as de <strong>Uso Sustentável</strong> e de <strong>Proteção Integral</strong>.</p>", "fundamentacao": "<p>Lei 9.985/2000 (SNUC) e art. 225, §1º, III, da Constituição Federal.</p>", "dica": "<p><strong>Atenção!</strong> A Compensação Ambiental exige a destinação de um valor ao apoio das UCs, porém o STF proibiu a fixação de um piso rígido mínimo de 0,5% (ADI 3378)!</p>"}, {"num": 8, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>Licenciamento ambiental pode ser definido como:</p>", "opcoes": {"A": "procedimento administrativo pelo qual o órgão ambiental competente licencia a localização, instalação, ampliação e a operação de empreendimentos e atividades utilizadoras de recursos ambientais, consideradas efetiva ou potencialmente poluidoras ou daquelas que, sob qualquer forma, possam causar degradação ambiental, considerando as disposições legais e regulamentares e as normas técnicas aplicáveis ao caso.", "B": "procedimento administrativo pelo qual o órgão ambiental competente licencia marcas para empreendimentos comerciais utilizadores de recursos ambientais, consideradas efetiva ou potencialmente poluidoras ou daquelas que, sob qualquer forma, possam causar degradação ambiental, considerando as disposições legais e regulamentares e as normas técnicas aplicáveis ao caso.", "C": "procedimento judicial pelo qual o órgão ambiental competente licencia a localização, instalação, ampliação e a operação de empreendimentos e atividades utilizadoras de recursos ambientais, consideradas efetiva ou potencialmente poluidoras ou daquelas que, sob qualquer forma, possam causar degradação ambiental, considerando as disposições legais e regulamentares e as normas técnicas aplicáveis ao caso.", "D": "procedimento judicial pelo qual o órgão ambiental competente autoriza o funcionamento de atividades utilizadoras de recursos ambientais, consideradas efetiva ou potencialmente poluidoras ou daquelas que, sob qualquer forma, possam causar degradação ambiental, considerando as disposições legais e regulamentares e as normas técnicas aplicáveis ao caso.", "E": "procedimento administrativo pelo qual o setor privado competente licencia a localização, instalação, ampliação e a operação de empreendimentos e atividades utilizadoras de recursos ambientais, consideradas efetiva ou potencialmente poluidoras ou daquelas que, sob qualquer forma, possam causar degradação ambiental, considerando as disposições legais e regulamentares e as normas técnicas aplicáveis ao caso."}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 9, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>A Resolução n. 1/86 do CONAMA, em seu art. 2º,  determina a obrigatoriedade do EIA para o licenciamento de uma série de atividades ali relacionadas, exceto:</p>", "opcoes": {"A": "Estradas de rodagem com duas ou mais faixas de rolamento;", "B": "Ferrovias", "C": "Oleodutos, gasodutos, minerodutos, troncos coletores e emissários de esgotos sanitários;", "D": "Extração de combustível fóssil (petróleo, xisto, carvão);", "E": "Construção de escolas infantis;"}, "gabarito": "E", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 10, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>O licenciamento ambiental é um ato administrativo complexo, que envolve três etapas distintas entre si e que são indispensáveis:</p>", "opcoes": {"A": "Licença prévia, licença de instalação e licença de operação", "B": "Licença preliminar, licença de operação e licença de instalação", "C": "Licença temporária, licença de operação e licença de funcionamento.", "D": "Licença temporária, licença de operação e licença de funcionamento", "E": "Licença provisória, licença ambiental e licença trabalhista."}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 11, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>Quanto ao licenciamento ambiental, assinale a opção correta.</p>", "opcoes": {"A": "a) Uma das modalidades de licença ambiental é a licença de operação, que é concedida após a apresentação dos documentos referentes a determinado empreendimento e de seu projeto de implementação e antes da licença de instalação.", "B": "b) O órgão licenciador tem sempre sua decisão vinculada aos resultados do estudo de impacto ambiental e ao seu respectivo relatório de impacto ambiental, sendo expressamente vedada a autorização de empreendimentos desaconselhados por este.", "C": "c) A licença ambiental não pode ser concedida a empreendimentos que não sejam cadastrados no Cadastro Técnico Federal de Empreendimentos Sustentáveis.", "D": "d) O CONAMA definiu, em uma de suas resoluções, estudos ambientais como sendo todos e quaisquer estudos relativos aos aspectos ambientais relacionados à localização, instalação, operação e ampliação de uma atividade ou empreendimento, que sejam apresentados como subsídios para a análise de razões para a concessão da licença.", "E": "Nenhuma das alternativas anteriores."}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 12, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>Considerando aspectos relativos à proteção administrativa do meio ambiente, assinale a opção correta.</p>", "opcoes": {"A": "a) São instrumentos da Política Nacional do Meio Ambiente, entre outros, o zoneamento ambiental, a avaliação de impactos ambientais e a criação de espaços territoriais especialmente protegidos, em áreas públicas ou particulares.", "B": "b) A legislação brasileira estabelece, em rol exemplificativo, os casos em que a administração pública deve solicitar ao empreendedor estudo de impacto ambiental (EIA). A exigência, ou não, do EIA está vinculada ao custo final do empreendimento proposto, de acordo com tabela fixada pela administração pública.", "C": "c) A legislação brasileira estabelece, em enumeração taxativa, todos os casos em que a administração pública deve exigir do empreendedor a elaboração de estudo prévio de impacto ambiental, o qual nunca poderá ser dispensado pelo órgão ambiental.", "D": "d) O EIA/RIMA é uma das fases do procedimento de licenciamento ambiental, devendo ser elaborado por equipe técnica multidisciplinar indicada pelo órgão ambiental competente, cabendo ao empreendedor recolher à administração pública o valor correspondente aos seus custos.", "E": "Nenhuma das alternativas anteriores."}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 13, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>Assinale a opção correta de acordo com a legislação de direito ambiental:</p>", "opcoes": {"A": "As atividades potencialmente poluidoras só podem receber a licença de operação após audiência pública realizada no Conselho Nacional de Meio Ambiente, sendo necessária a participação de dois terços dos conselheiros.", "B": "A licença de instalação só pode ser concedida a empreendimentos e atividades potencialmente poluidores após se verificar o efetivo cumprimento das medidas de controle ambiental propostas na licença de operação.", "C": "O licenciamento ambiental é o procedimento administrativo pelo qual o órgão ambiental competente licencia a localização, instalação, ampliação e operação de atividades e empreendimentos potencialmente poluidores ou de atividades que, sob qualquer forma, possam causar degradação ambiental.", "D": "Cabe ao órgão ambiental local definir os critérios de exigibilidade, o detalhamento e os riscos de atividade potencialmente poluidora ou degradadora, de acordo com os critérios estabelecidos pelo Conselho de Governo.", "E": "Nenhuma das alternativas anteriores."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 14, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>No que diz respeito à expedição das licenças ambientais, assinale a alternativa correta com base na Resolução n. 237/97 do CONAMA:</p>", "opcoes": {"A": "A Licença Prévia deverá ser concedida na fase preliminar do planejamento do empreendimento ou atividade, aprovando sua localização e concepção, atestando a viabilidade ambiental e estabelecendo os requisitos básicos e condicionantes a serem atendidos nas próximas fases de sua implantação.", "B": "A Licença de Operação diz respeito àquela que autoriza a operação da atividade ou empreendimento antes da verificação do efetivo cumprimento do que consta das licenças anteriores, com as medidas de controle ambiental e condicionantes determinados para a operação.", "C": "A Licença de Instalação autoriza a instalação do empreendimento ou atividade de acordo com as especificações constantes dos planos e programas, a serem aprovados, não incluindo as medidas de controle ambiental e demais condicionantes, da qual constituem motivo determinante.", "D": "A Licença Prévia deverá ser concedida na fase operacional do planejamento do empreendimento ou atividade, aprovando sua localização e concepção, atestando a viabilidade ambiental e estabelecendo os requisitos básicos e condicionantes a serem atendidos, caso haja necessidade.", "E": "Nenhuma das alternativas anteriores."}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 15, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>Assinale a alternativa incorreta:</p>\n<p>“Impacto ambiental pode ser definido como qualquer alteração das propriedades físicas, químicas e biológicas do meio ambiente, causada por qualquer forma de matéria ou energia resultante das atividades humanas que, direta ou indiretamente, afetem:”</p>", "opcoes": {"A": "a saúde, a segurança e o bem-estar da população;", "B": "as atividades sociais e econômicas;", "C": "a biota;", "D": "as condições estéticas do ser humano;", "E": "a qualidade dos recursos ambientais."}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 16, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>Analise as afirmativas a seguir:</p>\n<p>I. Iniciar a construção, a instalação, a ampliação, a reforma ou o funcionamento de estabelecimentos, obras ou serviços potencialmente poluidores sem a prévia obtenção de licença ambiental constitui infração administrativa ambiental.</p>\n<p>II. Compete aos órgãos ambientais estaduais competentes o licenciamento ambiental de atividades localizadas ou desenvolvidas em dois ou mais Estados.</p>\n<p>III.    O Estudo Prévio de Impacto Ambiental e seu respectivo Relatório de Impacto Ambiental (EIA/Rima) devem ser exigidos e apresentados antes da concessão da Licença Prévia, fase do licenciamento ambiental em que é analisada a localização e viabilidade ambiental do projeto.</p>\n<p>IV. As audiências públicas realizadas no âmbito dos procedimentos de licenciamento ambiental destinam-se a fornecer informações sobre o projeto e seus impactos ambientais, bem como a possibilitar a discussão e o debate sobre o Relatório de Impacto Ambiental. As críticas e sugestões manifestadas durante as audiências públicas vinculam a decisão do órgão ambiental competente a respeito da concessão da licença ambiental ou do seu indeferimento.</p>\n<p>Assinale:</p>", "opcoes": {"A": "se somente as afirmativas I e III estiverem corretas.", "B": "se somente as afirmativas II e IV estiverem corretas.", "C": "se somente as afirmativas III e IV estiverem corretas.", "D": "se todas as afirmativas estiverem corretas.", "E": "NDA"}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 17, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>A Lei n. 6.938/81 trouxe importantes inovações no que diz respeito à legislação ambiental:</p>\n<p>I. O conceito de poluição contido no Art. 3°, inciso III, afirma que o dano ambiental não se limita ao dano ecológico puro, tendo objeto mais amplo, que inclui os aspectos naturais, culturais e individuais.</p>\n<p>II. Em matéria de dano ambiental, a Lei em comento adota o regime da responsabilidade objetiva, sendo imprescindível o nexo causal entre a fonte poluidora e o dano advindo dela.</p>\n<p>III. São os únicos Instrumentos da Política Nacional do Meio Ambiente: o estabelecimento de padrões de qualidade ambiental, o zoneamento ambiental, a avaliação de impactos ambientais, o licenciamento e a revisão de atividades efetiva ou potencialmente poluidoras. Assinale:</p>", "opcoes": {"A": "se somente a afirmativa I estiver correta.", "B": "se somente a afirmativa III estiver correta.", "C": "se somente as afirmativas I e II estiverem corretas.", "D": "se somente as afirmativas II e III estiverem corretas.", "E": "se todas as afirmativas estiverem corretas."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 18, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>O Estudo de Impacto de Vizinhança – EIV é uma espécie do gênero Avaliação de Impacto Ambiental e está disciplinado no Estatuto da Cidade, que estabelece e enumera os instrumentos da política de desenvolvimento urbano, de acordo com seus arts. 4º e 36 a 38. A esse respeito, assinale a alternativa correta.</p>", "opcoes": {"A": "As atividades de relevante e significativo impacto ambiental que atingem mais de um Município são precedidas de estudo de impacto de vizinhança.", "B": "O estudo de impacto de vizinhança só pode ser exigido em área rural pelo órgão ambiental municipal.", "C": "A Avaliação de Impacto Ambiental é exigida para analisar o adensamento populacional e a geração de tráfego e demanda por transporte público advindos da edificação de um prédio.", "D": "A elaboração de estudo de impacto de vizinhança não substitui a elaboração de estudo prévio de impacto ambiental, requerida nos termos da legislação ambiental.", "E": "NDA"}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 19, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>Na perspectiva da tutela do direito difuso ao meio ambiente, o ordenamento constitucional exigiu o estudo de impacto ambiental para instalação e desenvolvimento de certas atividades. Nessa perspectiva, o estudo prévio de impacto ambiental está concretizado nos princípios:</p>", "opcoes": {"A": "do limite.", "B": "da prevenção e da intervenção estatal obrigatória.", "C": "da vedação ao retrocesso.", "D": "do poluidor-pagador.", "E": "da cooperação."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 20, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>Fabiana, empreendedora individual, obtém, junto ao órgão municipal, licença de instalação de uma fábrica de calçados. A respeito da hipótese formulada, assinale a afirmativa correta:</p>", "opcoes": {"A": "A licença não é válida, uma vez que os municípios têm competência para a análise de estudos de impacto ambiental, mas não para a concessão de licença ambiental.", "B": "Com a licença de instalação obtida, a fábrica de calçados poderá iniciar suas atividades de produção, gerando direito adquirido pelo prazo mencionado na licença expedida pelo município.", "C": "A licença é válida, porém não há impedimento que um Estado e a União expeçam licenças relativas ao mesmo empreendimento, caso entendam que haja impacto de âmbito regional e nacional, respectivamente.", "D": "Para o início da produção de calçados, é imprescindível a obtenção de licença de operação, sendo concedida após a verificação do cumprimento dos requisitos previstos nas licenças anteriores.", "E": "Nenhuma das alternativas anteriores."}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 21, "tema": "Módulo 5 - Responsabilidade Civil Ambiental", "enunciado": "<p>Um shopping center, que possui cerca de 250 lojas e estacionamento para dois mil veículos, foi construído há doze anos sobre um antigo aterro sanitário e, desde sua inauguração, sofre com a decomposição de material orgânico do subsolo, havendo emissão diária de gás metano, em níveis considerados perigosos à saúde humana, podendo causar explosões. Em razão do caso exposto, assinale a alternativa correta:</p>", "opcoes": {"A": "Como o shopping foi construído há mais de cinco anos, a obrigação de elaborar estudo prévio de impacto ambiental e de se submeter a licenciamento já prescreveu. Assim o empreendimento poderá continuar funcionando.", "B": "A licença de operação ambiental tem prazo de validade de dez anos. Logo o shopping já cumpriu com suas obrigações referentes ao licenciamento e ao estudo prévio de impacto ambiental, e poderá continuar com suas atividades regularmente.", "C": "A decomposição de material orgânico continua ocorrendo, e é considerada perigosa à saúde humana e ao meio ambiente. Logo, o shopping center em questão poderá ser obrigado pelo órgão ambiental competente a adotar medidas para promover a dispersão do gás metano, de forma a minimizar ou anular os riscos ambientais, mesmo que já possua licença de operação válida.", "D": "Caso o shopping center possua licença de operação válida, não poderá ser obrigado pelo órgão ambiental competente, no caso exposto, a adotar novas medidas para a dispersão do gás metano. Apenas no momento da renovação de sua licença de operação poderá ser obrigado a adquirir novo equipamento para tal fim.", "E": "Nenhuma das alternativas anteriores."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Responsabilidade Civil Ambiental</strong> tem natureza puramente patrimonial (reparação do dano). Fundamenta-se no princípio do poluidor-pagador e vigora a Teoria do Risco Integral.</p>", "fundamentacao": "<p>Art. 14, §1º da Lei 6.938/81 (PNMA). Responsabilidade objetiva e solidária.</p>", "dica": "<p><strong>Atenção!</strong> No Risco Integral, <strong>NÃO</strong> há excludentes de responsabilidade. Caso fortuito e força maior não isentam a obrigação de reparar o meio ambiente!</p>"}, {"num": 22, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>A Área de Preservação Permanente e as da Área de Reserva Legal constituem:</p>", "opcoes": {"A": "Servidão administrativa", "B": "Limitação administrativa", "C": "Intervenção administrativa", "D": "Tombamento administrativo", "E": "Requisição administrativa"}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 23, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>A instituição de Área de Preservação Permanente ou de Área de Reserva Legal impõe ao proprietário do imóvel rural a seguinte obrigação:</p>", "opcoes": {"A": "Plantar um determinado número de espécies vegetais anualmente.", "B": "Reintegrar animais silvestres à fauna nativa.", "C": "Não suprimir a vegetação da área correspondente.", "D": "Desenvolver no local empreendimento voltado ao ecoturismo.", "E": "Não empregar no trabalho rural menores de dezesseis anos."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 24, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>A supressão da vegetação em APP só é permitida nos seguintes casos, EXCETO:</p>", "opcoes": {"A": "Por motivo de utilidade pública", "B": "Por motivo de interesse social", "C": "Em virtude do baixo impacto ambiental", "D": "Para fins de desenvolvimento urbano", "E": "Somente por utilidade pública, em se tratando de vegetação nativa protetora de nascentes."}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 25, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>De acordo com a legislação florestal em vigor, todo imóvel rural, quando localizado na Amazônia Legal, deve manter área com cobertura de vegetação nativa, a título de Reserva Legal, sem prejuízo da aplicação das normas sobre as Áreas de Preservação Permanente, nos percentuais mínimos de</p>", "opcoes": {"A": "75% (setenta e cinco por cento), no imóvel situado em área de florestas e 20% (vinte por cento), no imóvel situado em área de cerrado.", "B": "80% (oitenta por cento), no imóvel situado em área de florestas e 35% (trinta e cinco por cento), no imóvel situado em área de cerrado.", "C": "50% (cinquenta por cento), no imóvel situado em área de florestas e 35% (trinta e cinco por cento), no imóvel situado em área de cerrado.", "D": "80% (oitenta por cento), no imóvel situado em área de florestas e 20% (vinte por cento), no imóvel situado em área de cerrado.", "E": "50% (cinquenta por cento), no imóvel situado em área de florestas e 25% (vinte e cinco por cento), no imóvel situado em área de cerrado."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 26, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>Serão consideradas Áreas de Preservação Permanente, quando assim declaradas por ato do chefe do Poder Executivo, as áreas que tenham por destinação, EXCETO:</p>", "opcoes": {"A": "Conter a erosão do solo e mitigar riscos de enchentes e deslizamentos de terra e de rocha;", "B": "Proteger as restingas ou veredas;", "C": "Proteger áreas industriais;", "D": "Proteger sítios de excepcional beleza ou de valor científico, cultural ou histórico;", "E": "Auxiliar a defesa do território nacional, a critério das autoridades militares."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 27, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>De acordo com as disposições do Código Florestal, são consideradas de preservação permanente as áreas ao longo de qualquer curso d’água, desde o seu nível mais alto, em faixa marginal cuja largura mínima será de:</p>", "opcoes": {"A": "10 metros para os cursos d’água com até 5 metros de largura.", "B": "30 metros para os cursos d’água de 15 metros de largura.", "C": "50 metros para os cursos d’água que tenham 40 metros de largura.", "D": "100 metros para os cursos d’água que tenham mais de 200 metros de largura.", "E": "200 metros para cursos d’água que tenham de 100 a 200 metros de largura."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 28, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>Para os efeitos previstos na Lei n.º 12.651/12, que trata do Código Florestal, considera-se Área de Preservação Permanente, em zonas rurais ou urbanas</p>", "opcoes": {"A": "as faixas marginais de qualquer curso de água artificial, perene e intermitente, incluídos os efêmeros, desde a borda da calha do leito regular, em largura mínima de 150 metros, para os cursos de água de menos de 15 metros de largura.", "B": "as áreas no entorno dos lagos e lagoas naturais, em faixa com largura mínima de 100 metros, em zonas urbanas, exceto para o corpo de água com até trinta hectares de superfície, cuja faixa marginal será de 100 metros.", "C": "as áreas no entorno das nascentes e dos olhos de água perenes, qualquer que seja sua situação topográfica, no raio mínimo de 50 metros.", "D": "as restingas, com declividade superior a 45º, equivalente à 100% na linha de maior declive.", "E": "os manguezais, em faixa com largura mínima de 100 metros em zonas urbanas."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 29, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>A respeito da proteção e uso das florestas e demais formas de vegetação nativa, assinale a opção correta:</p>", "opcoes": {"A": "São áreas de preservação permanente, além das elencadas no Código Florestal, as áreas cobertas com florestas e demais formas de vegetação nativa consideradas de interesse social, devendo a declaração de interesse social ocorrer, necessariamente, por lei em sentido formal.", "B": "Considera-se manejo sustentável a substituição de vegetação nativa e de formações sucessoras por outras coberturas do solo, como atividades agropecuárias, industriais, de geração e transmissão de energia, de mineração e de transporte, assentamentos urbanos ou outras formas de ocupação humana.", "C": "A área de preservação permanente é a que se localiza no interior de uma propriedade ou posse rural, devendo ser mantida a sua cobertura vegetal nativa, por ser ela necessária ao abrigo e proteção da fauna e flora nativas, à conservação da biodiversidade e à reabilitação dos processos ecológicos.", "D": "As florestas existentes no território nacional e as demais formas de vegetação nativa, reconhecidas de utilidade às terras que revestem, são bens de interesse comum a todos os habitantes do país, exercendo-se os direitos de propriedade com as limitações que a legislação em geral, e em especial o Código Florestal, estabelecem.", "E": "NDA"}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 30, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>De acordo com o Código Florestal Brasileiro, Lei n. 12.615/2012, considera-se Área de Preservação Permanente, em zonas urbanas, as áreas no entorno dos lagos e lagoas naturais, em faixa com largura mínima de:</p>", "opcoes": {"A": "25 metros.", "B": "30 metros.", "C": "50 metros.", "D": "100 metros.", "E": "Nenhuma das alternativas anteriores."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 31, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>Segundo a Lei n° 12.651/2012, as faixas marginais de qualquer curso d’água natural perene e intermitente, excluídos os efêmeros, desde a borda da calha do leito regular, em largura mínima de 30 (trinta) metros, para os cursos d’água de menos de 10 (dez) metros de largura, em zonas rurais ou urbanas, são consideradas áreas de:</p>", "opcoes": {"A": "reserva biológica.", "B": "preservação permanente.", "C": "manejo sustentável.", "D": "reserva legal.", "E": "conservação ambiental."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 32, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>De acordo com a Lei nº 12.651/2012, considera-se Área de Preservação Permanente, em zonas rurais ou urbanas:</p>", "opcoes": {"A": "as encostas ou partes destas com declividade superior a 30°, equivalente a 90% (noventa por cento) na linha de maior declive.", "B": "as áreas no entorno dos lagos e lagoas naturais, em faixa com largura mínima de 100 (cem) metros, em zonas urbanas.", "C": "as faixas marginais de qualquer curso d’água natural perene e intermitente, excluídos os efêmeros, desde a borda da calha do leito regular, em largura mínima de 200 (duzentos) metros, para os cursos d’água que tenham de 50 (cinquenta) a 200 (duzentos) metros de largura.", "D": "em veredas, a faixa marginal, em projeção horizontal, com largura mínima de 50 (cinquenta) metros, a partir do espaço permanentemente brejoso e encharcado.", "E": "as bordas dos tabuleiros ou chapadas, até a linha de ruptura do relevo, em faixa nunca inferior a 30 (trinta) metros em projeções horizontais."}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 33, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>Em relação ao disposto na Lei n.º 12.651/2012, analise as assertivas a seguir e assinale a alternativa correta:</p>", "opcoes": {"A": "A Lei n.º 12.651/2012 atenderá ao princípio das responsabilidades comuns mas diferenciadas da União, dos Estados, do Distrito Federal e dos Municípios, em colaboração com a sociedade civil, na criação de políticas para a preservação e restauração da vegetação nativa e de suas funções ecológicas e sociais nas áreas rurais.", "B": "As florestas existentes no território nacional e as demais formas de vegetação nativa, reconhecidas de utilidade às terras que revestem são bens públicos, exercendo-se os direitos de propriedade e a posse com respeito à sua função socioambiental.", "C": "As obrigações previstas na Lei n.º 12.651/2012 têm natureza real e são transmitidas apenas ao sucessor, a título universal, no caso de transferência de domínio ou posse do imóvel rural.", "D": "Na utilização e exploração da vegetação, as ações ou omissões contrárias às disposições da Lei n.º 12.651/2012 são consideradas uso irregular da propriedade, aplicando-se o procedimento ordinário previsto no inciso II do art. 275 da Lei n.º 5.869, de 11 de janeiro de 1973, sem prejuízo da responsabilidade civil independente da existência de culpa, prevista na Lei n.º 6.938/81 e das sanções penais cabíveis.", "E": "A Lei n.º 12.651/2012 afirma o compromisso soberano do Brasil com a preservação das suas florestas e demais formas de vegetação nativa, bem como da biodiversidade, do solo, dos recursos hídricos e da integridade do sistema climático, para o bem estar das gerações presentes e futuras."}, "gabarito": "E", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 34, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>A partir do estudo em matéria ambiental da Lei Nº 12.651 de 25 de maio de 2012, com suas alterações posteriores, é correto afirmar:</p>", "opcoes": {"A": "Nas Reurb-S dos núcleos urbanos informais que ocupam Áreas de Preservação Permanente, não será admitida a regularização fundiária, devendo ser retirados os ocupantes de referida área e realocados em imóveis previamente previstos em lei específica de regularização fundiária urbana.", "B": "O Cadastro Ambiental Rural é registro público eletrônico de âmbito nacional, obrigatório somente para os imóveis rurais acima de 150 hectares, com a finalidade de integrar as informações ambientais das grandes propriedades rurais e propiciar o planejamento ambiental e econômico das áreas em questão.", "C": "Nas áreas passíveis de uso alternativo do solo, a supressão de vegetação que abrigue espécie da flora ou da fauna ameaçada de extinção, segundo lista oficial publicada pelos órgãos federal, estadual ou municipal do Sisnama, ou espécies migratórias, dependerá da adoção de medidas compensatórias e mitigadoras que assegurem a conservação da espécie.", "D": "Por se constituir como obrigação propter rem, o ônus de conservação da reserva legal com cobertura de vegetação nativa é outorgado apenas ao proprietário do imóvel rural, pelo que, na prática, fica impedido o órgão ambiental de aplicar eventuais sanções a meros posseiros que degradem as áreas ocupadas a título precário.", "E": "Nenhuma das alternativas anteriores."}, "gabarito": "C", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 35, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>A Lei nº 12.651 de 25 de maio de 2012, conhecida popularmente como Novo Código Florestal Brasileiro, dispõe sobre a proteção da vegetação nativa. Esta Lei estabelece normas gerais sobre a proteção da vegetação, áreas de Preservação Permanente e as áreas de Reserva Legal; a exploração florestal, o suprimento de matéria-prima florestal, o controle da origem dos produtos florestais e o controle e prevenção dos incêndios florestais, e prevê instrumentos econômicos e financeiros para o alcance de seus objetivos. Considerando a Lei citada, analise as afirmativas a seguir.</p>\n<p>BRASIL. Lei nº 12.651 de 25 de maio de 2012. Disponível em: <http://www planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm>. Acesso em: 27 jul. 2017.</p>\n<p>I. Define Área de Preservação Permanente (APP) como área protegida, coberta ou não por vegetação nativa, com a função ambiental de preservar os recursos hídricos, a paisagem, a estabilidade geológica e a biodiversidade […]. A largura das faixas marginais de APP no entorno de rios e córregos variam de acordo com a largura desses cursos d’água. II. Todo imóvel rural deve manter área com cobertura de vegetação nativa, a título de Reserva Legal (RL). Em áreas da Amazônia Legal, deve-se destinar para RL: a) 80% (oitenta por cento), no imóvel situado em área de florestas; b) 35% (trinta e cinco por cento), no imóvel situado em área de cerrado; c) 20% (vinte por cento), no imóvel situado em área de campos gerais. Nas demais regiões do país a RL deve ser de 20% (vinte por cento) da área total do imóvel. III. É criado o Cadastro Ambiental Rural - CAR, no âmbito do Sistema Nacional de Informação sobre Meio Ambiente - SINIMA, registro público eletrônico de âmbito nacional, obrigatório para todos os imóveis rurais, com a finalidade de integrar as informações ambientais das propriedades e posses rurais, compondo base de dados para controle, monitoramento, planejamento ambiental e econômico e combate ao desmatamento. Estão corretas as afirmativas:</p>", "opcoes": {"A": "I apenas.", "B": "I, II e III.", "C": "I e II apenas.", "D": "II e III apenas.", "E": "I e III apenas."}, "gabarito": "B", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 36, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>Segundo o disposto na Lei Federal n. 12.651/2012 (Código Florestal), é incorreto afirmar que:</p>", "opcoes": {"A": "O corte ou a exploração de espécies nativas plantadas em área de uso alternativo do solo dependem de autorização prévia.", "B": "Entende-se por interesse social as atividades de pesquisa e extação de areia, argila, saibro e cascalho, outorgadas pela autoridade competente.", "C": "Não é permitida a conversão de vegetação nativa para uso alternativo do solo no imóvel rural que possuir área abandonada.", "D": "Não será exigida área de preservação permanente no entorno de reservatórios artificiais de água que não decorram de barramento ou represamento de cursos d'água naturais.", "E": "Todas as alternativas estão incorretas."}, "gabarito": "A", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 37, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>No que se refere às disposições da Lei Nº 12.651, de 25 de maio de 2012, também conhecida como novo Código Florestal e sua aplicação no Direito Ambiental, é correto afirmar:</p>", "opcoes": {"A": "Área de Preservação Permanente é aquela área localizada no interior de uma propriedade ou posse rural que tem por função assegurar o uso econômico de modo sustentável dos recursos naturais do imóvel rural, auxiliar a conservação e a reabilitação dos processos ecológicos e promover a conservação da biodiversidade, bem como o abrigo e a proteção de fauna e flora silvestre e da flora nativa.", "B": "São de utilidade pública as atividades imprescindíveis à proteção da integridade da vegetação nativa, tais como prevenção, combate e controle do fogo, controle da erosão, erradicação de invasoras e proteção de plantios com espécies nativas.", "C": "A intervenção ou a supressão de vegetação nativa em Área de Preservação Permanente somente ocorrerá nas hipóteses de utilidade pública ou de baixo impacto ambiental, previstas em lei.", "D": "Tendo ocorrido supressão de vegetação situada em Área de Preservação Permanente, o proprietário da área rural, possuidor ou ocupante a qualquer título é obrigado a promover a recomposição da vegetação, ressalvados os usos autorizados em lei, tratando-se de obrigação de natureza real, transmitida ao sucessor.", "E": "Nenhumas das alternativas anteriores."}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 38, "tema": "Módulo 6 - Responsabilidade Administrativa Ambiental", "enunciado": "<p>Rafael é proprietário de um imóvel rural com vegetação de floresta no estado do Pará. Esse imóvel deixou de ter área de reserva legal porque o proprietário anterior a suprimiu. Nessa situação, Rafael:</p>", "opcoes": {"A": "não tem obrigação de reflorestar a referida área, porque não foi ele quem causou a degradação.", "B": "deve reflorestar 50% de sua propriedade.", "C": "deve reflorestar 30% de sua propriedade.", "D": "deve reflorestar 80% de sua propriedade.", "E": "deve reflorestar 20% de sua propriedade."}, "gabarito": "D", "core": true, "sintese": "<p>A <strong>Responsabilidade Administrativa</strong> consiste no poder de polícia ambiental (multas, embargos). Exige-se a demonstração de culpa ou dolo do agente (caráter subjetivo).</p>", "fundamentacao": "<p>Art. 70 e seguintes da Lei 9.605/98 e jurisprudência pacificada do STJ.</p>", "dica": "<p><strong>Atenção!</strong> Não confunda com a Civil. Para o IBAMA aplicar multa (Responsabilidade Administrativa), é preciso comprovar que o infrator agiu com dolo ou culpa (Responsabilidade Subjetiva)!</p>"}, {"num": 39, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>As empresas sujeitas ao regime de outorga de direitos para o uso da água são as que fazem uso da água nas seguintes situações, EXCETO:</p>", "opcoes": {"A": "Derivação ou captação de parcela da água existente em um corpo de água para consumo final, inclusive abastecimento público, ou insumo de processo produtivo;", "B": "Extração de água de aquífero subterrâneo para consumo final ou insumo de processo produtivo;", "C": "Lançamento em corpo de água de esgotos e demais resíduos líquidos ou gasosos, tratados ou não, com o fim de sua diluição, transporte ou disposição final;", "D": "Aproveitamento dos potenciais hidrelétricos;", "E": "Aproveitamento gratuito em complexos aquáticos, para fins de lazer."}, "gabarito": "E", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 40, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>A respeito da outorga de direitos para o uso da água, não é correto afirmar:</p>", "opcoes": {"A": "A concessão da outorga está condicionada às prioridades de uso que tenham sido estabelecidas nos Planos de Recursos Hídricos.", "B": "No caso de uso dos recursos hídricos para fins de geração de energia elétrica, a outorga está condicionada ao Plano Nacional de Recursos Hídricos.", "C": "A outorga está condicionada ao pagamento pelo uso da água.", "D": "A outorga não poderá ser superior a 35 anos.", "E": "A outorga vencida não poderá ser renovada."}, "gabarito": "E", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 41, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>A respeito das águas, no plano jurídico, não é correto afirmar:</p>", "opcoes": {"A": "Constituem um bem ambiental", "B": "São alienáveis", "C": "São um bem de domínio público", "D": "São inalienáveis", "E": "São bens de uso comum do povo"}, "gabarito": "B", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 42, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>Com relação aos recursos hídricos, assinale a opção correta.</p>", "opcoes": {"A": "De acordo com a Política Nacional de Recursos Hídricos, em situações de escassez, o uso dos recursos hídricos deve restringir-se ao consumo humano, vedada sua utilização para qualquer outra finalidade.", "B": "A água é bem de domínio público, portanto, todo e qualquer uso dos recursos hídricos está sujeito a outorga pelo poder público.", "C": "A outorga de direito de uso de recursos hídricos não implica a alienação das águas, que são inalienáveis, mas o simples direito de seu uso.", "D": "O poder público é apenas o gestor dos recursos hídricos, não lhe sendo facultado cobrar por sua utilização, visto que a água, elemento que compõe o meio ambiente, não é considerada bem econômico.", "E": "A gestão dos recursos hídricos deve ser centralizada, cabendo ao Ministério do Meio Ambiente promover a articulação do planejamento de recursos hídricos no âmbito nacional, regional e estadual, bem como com seus usuários diretos."}, "gabarito": "C", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</strong>, pessoas físicas e jurídicas podem ser condenadas por crimes ambientais, conforme a Lei de Crimes Ambientais.</p>", "fundamentacao": "<p>Art. 3º da Lei 9.605/98 e Art. 225, § 3º, da CF.</p>", "dica": "<p><strong>Atenção!</strong> O STF sepultou a Teoria da Dupla Imputação. A empresa (PJ) pode ser processada e condenada criminalmente sozinha, sem o diretor no banco dos réus!</p>"}, {"num": 43, "tema": "Módulo 7 - Responsabilidade Penal Ambiental", "enunciado": "<p>Com relação aos recursos hídricos, assinale a opção correta:</p>", "opcoes": {"A": "De acordo com a Política Nacional de Recursos Hídricos, em situações de escassez, o uso dos recursos hídricos deve restringir-se ao consumo humano, vedada sua utilização para qualquer outra finalidade.", "B": "A água é bem de domínio público, portanto, todo e qualquer uso dos recursos hídricos está sujeito a outorga pelo poder público.", "C": "A outorga de direito de uso de recursos hídricos implica a alienação das águas, que são inalienáveis, mas o simples direito de seu uso.", "D": "O poder público é apenas o gestor dos recursos hídricos, não lhe sendo facultado cobrar por sua utilização, visto que a água, elemento que compõe o meio ambiente, não é considerada bem econômico.", "E": "Nenhuma das alternativas anteriores."}, "gabarito": "E", "core": true, "sintese": "<p>Na <strong>Responsabilidade Penal</stron
